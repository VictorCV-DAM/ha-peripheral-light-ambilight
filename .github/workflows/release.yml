name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip integration for HACS
        run: |
          cd custom_components/peripheral_light_ambilight
          zip -r ../../peripheral_light_ambilight.zip . -x "*.pyc" -x "*/__pycache__/*"
          cd ../..

      - name: Upload zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: peripheral_light_ambilight.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

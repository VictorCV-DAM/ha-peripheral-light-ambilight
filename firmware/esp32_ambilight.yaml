# Board: ESP32-C3 DevKitM-1 (Espressif RISC-V 160MHz)
esphome:
  name: esp32-ambiligth
  friendly_name: Ambilight Govee Bridge
  includes:
    - govee_sniffer.h
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - homeassistant.service:
          service: automation.reload

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway_ip
    subnet: 255.255.255.0
    dns1: !secret dns_ip

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode:
        input: true
    id: pin_datos
    internal: true

globals:
  - id: test_en_curso
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: template
    name: "Ambilight Mode"
    id: modo_ambilight
    icon: "mdi:television-ambient-light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: |-
          id(modo_luces).publish_state("Ambilight");
    on_turn_off:
      - lambda: |-
          id(modo_luces).publish_state("Custom");

  - platform: template
    name: "Invert Rotation Direction"
    id: invertir_sentido
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Enable Ceiling Light (Top Edge)"
    id: activar_techo
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

select:
  - platform: template
    name: "Mode Selector"
    id: modo_luces
    icon: "mdi:tune-variant"
    options:
      - "Ambilight"
      - "Custom"
    initial_option: "Ambilight"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          if (x == "Ambilight") {
            id(modo_ambilight).publish_state(true);
          } else {
            id(modo_ambilight).publish_state(false);
          }

number:
  - platform: template
    name: "360° Rotation"
    id: rotacion_offset
    unit_of_measurement: "°"
    icon: "mdi:rotate-360"
    min_value: -180
    max_value: 180
    step: 1
    initial_value: 0
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Left Edge LEDs"
    id: num_leds_izq
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Top Edge LEDs (Ceiling)"
    id: num_leds_sup
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Right Edge LEDs"
    id: num_leds_der
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Bottom Edge LEDs (Center)"
    id: num_leds_inf
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

script:
  - id: enviar_color_ha
    mode: parallel
    max_runs: 10
    parameters:
      entidad: string
      r: int
      g: int
      b: int
    then:
      - lambda: |-
          ESP_LOGI("ha_send", "EVENT -> %s: R=%d G=%d B=%d", entidad.c_str(), r, g, b);
      - homeassistant.event:
          event: esphome.ambilight_color
          data:
            entity_id: !lambda "return entidad;"
            r: !lambda "return std::to_string(r);"
            g: !lambda "return std::to_string(g);"
            b: !lambda "return std::to_string(b);"

interval:
  - interval: 40ms
    then:
      - lambda: |-
          static int fIzqR = -1, fIzqG = -1, fIzqB = -1;
          static int fSupR = -1, fSupG = -1, fSupB = -1;
          static int fCenR = -1, fCenG = -1, fCenB = -1;
          static int fDerR = -1, fDerG = -1, fDerB = -1;

          static int pIzqR = -1, pIzqG = -1, pIzqB = -1;
          static int pSupR = -1, pSupG = -1, pSupB = -1;
          static int pCenR = -1, pCenG = -1, pCenB = -1;
          static int pDerR = -1, pDerG = -1, pDerB = -1;

          if (id(test_en_curso) || !id(modo_ambilight).state) {
            fIzqR = -1; fSupR = -1; fCenR = -1; fDerR = -1;
            pIzqR = -1; pSupR = -1; pCenR = -1; pDerR = -1;
            return;
          }

          const int MAX_LEDS = 37;
          uint8_t ledData[MAX_LEDS * 3] = {0};

          int ledsLeidos = capture_govee_frame(ledData, MAX_LEDS);

          if (ledsLeidos < 37) return;

          float rotDeg = id(rotacion_offset).state;
          int offset = (int)roundf(rotDeg * 36.0f / 360.0f);
          bool invert = id(invertir_sentido).state;
          int nIzq = (int)id(num_leds_izq).state;
          int nSup = (int)id(num_leds_sup).state;
          int nDer = (int)id(num_leds_der).state;
          int nInf = (int)id(num_leds_inf).state;

          const int TOTAL_LEDS_LOOP = 36;

          auto getLedIndex = [&](int virtualPos) -> int {
            int pos = virtualPos % TOTAL_LEDS_LOOP;
            if (invert) {
              pos = (TOTAL_LEDS_LOOP * 10 + offset - pos) % TOTAL_LEDS_LOOP;
            } else {
              pos = (TOTAL_LEDS_LOOP * 10 + pos + offset) % TOTAL_LEDS_LOOP;
            }
            return 1 + pos;
          };

          // WS2811 GRB: Byte 0 = G, Byte 1 = R, Byte 2 = B
          // A. Zona Izquierda
          long sR_izq = 0, sG_izq = 0, sB_izq = 0;
          for (int i = 0; i < nIzq; i++) {
            int k = getLedIndex(i);
            sG_izq += ledData[k * 3 + 0];
            sR_izq += ledData[k * 3 + 1];
            sB_izq += ledData[k * 3 + 2];
          }
          int izqR = sR_izq / nIzq;
          int izqG = sG_izq / nIzq;
          int izqB = sB_izq / nIzq;

          // B. Zona Techo (Borde Superior)
          int startSupVirt = nIzq;
          long sR_sup = 0, sG_sup = 0, sB_sup = 0;
          for (int i = startSupVirt; i < startSupVirt + nSup; i++) {
            int k = getLedIndex(i);
            sG_sup += ledData[k * 3 + 0];
            sR_sup += ledData[k * 3 + 1];
            sB_sup += ledData[k * 3 + 2];
          }
          int supR = (nSup > 0) ? (sR_sup / nSup) : 0;
          int supG = (nSup > 0) ? (sG_sup / nSup) : 0;
          int supB = (nSup > 0) ? (sB_sup / nSup) : 0;

          // C. Zona Derecha
          int startDerVirt = nIzq + nSup;
          long sR_der = 0, sG_der = 0, sB_der = 0;
          for (int i = startDerVirt; i < startDerVirt + nDer; i++) {
            int k = getLedIndex(i);
            sG_der += ledData[k * 3 + 0];
            sR_der += ledData[k * 3 + 1];
            sB_der += ledData[k * 3 + 2];
          }
          int derR = sR_der / nDer;
          int derG = sG_der / nDer;
          int derB = sB_der / nDer;

          // D. Zona Centro (Borde Inferior / Mesa)
          int startInfVirt = startDerVirt + nDer;
          if (nInf < 1) nInf = 1;

          long sR_cen = 0, sG_cen = 0, sB_cen = 0;
          for (int i = startInfVirt; i < startInfVirt + nInf; i++) {
            int k = getLedIndex(i);
            sG_cen += ledData[k * 3 + 0];
            sR_cen += ledData[k * 3 + 1];
            sB_cen += ledData[k * 3 + 2];
          }
          int cenR = sR_cen / nInf;
          int cenG = sG_cen / nInf;
          int cenB = sB_cen / nInf;

          static int cIzqR = -1, cIzqG = -1, cIzqB = -1;
          static int cSupR = -1, cSupG = -1, cSupB = -1;
          static int cDerR = -1, cDerG = -1, cDerB = -1;
          static int cCenR = -1, cCenG = -1, cCenB = -1;

          if (fIzqR >= 0) {
            // Filtro Anti-Glitch: Rechazar saltos bruscos aislados (>40) que no se confirmen en 2 tramas consecutivas
            if ((abs(izqR - fIzqR) > 40 || abs(izqG - fIzqG) > 40 || abs(izqB - fIzqB) > 40) &&
                (abs(izqR - cIzqR) > 25 || abs(izqG - cIzqG) > 25 || abs(izqB - cIzqB) > 25)) {
              cIzqR = izqR; cIzqG = izqG; cIzqB = izqB;
              izqR = fIzqR; izqG = fIzqG; izqB = fIzqB;
            } else {
              cIzqR = izqR; cIzqG = izqG; cIzqB = izqB;
            }

            if ((abs(derR - fDerR) > 40 || abs(derG - fDerG) > 40 || abs(derB - fDerB) > 40) &&
                (abs(derR - cDerR) > 25 || abs(derG - cDerG) > 25 || abs(derB - cDerB) > 25)) {
              cDerR = derR; cDerG = derG; cDerB = derB;
              derR = fDerR; derG = fDerG; derB = fDerB;
            } else {
              cDerR = derR; cDerG = derG; cDerB = derB;
            }

            if ((abs(cenR - fCenR) > 40 || abs(cenG - fCenG) > 40 || abs(cenB - fCenB) > 40) &&
                (abs(cenR - cCenR) > 25 || abs(cenG - cCenG) > 25 || abs(cenB - cCenB) > 25)) {
              cCenR = cenR; cCenG = cenG; cCenB = cenB;
              cenR = fCenR; cenG = fCenG; cenB = fCenB;
            } else {
              cCenR = cenR; cCenG = cenG; cCenB = cenB;
            }

            if ((abs(supR - fSupR) > 40 || abs(supG - fSupG) > 40 || abs(supB - fSupB) > 40) &&
                (abs(supR - cSupR) > 25 || abs(supG - cSupG) > 25 || abs(supB - cSupB) > 25)) {
              cSupR = supR; cSupG = supG; cSupB = supB;
              supR = fSupR; supG = fSupG; supB = fSupB;
            } else {
              cSupR = supR; cSupG = supG; cSupB = supB;
            }
          }

          // Filtro Ultra-Reactivo (Respuesta instantanea para cine y reproduccion en directo)
          if (fIzqR < 0) {
            fIzqR = izqR; fIzqG = izqG; fIzqB = izqB;
            fSupR = supR; fSupG = supG; fSupB = supB;
            fCenR = cenR; fCenG = cenG; fCenB = cenB;
            fDerR = derR; fDerG = derG; fDerB = derB;
          } else {
            fIzqR = (fIzqR * 2 + izqR * 8) / 10;
            fIzqG = (fIzqG * 2 + izqG * 8) / 10;
            fIzqB = (fIzqB * 2 + izqB * 8) / 10;

            fSupR = (fSupR * 2 + supR * 8) / 10;
            fSupG = (fSupG * 2 + supG * 8) / 10;
            fSupB = (fSupB * 2 + supB * 8) / 10;

            fCenR = (fCenR * 2 + cenR * 8) / 10;
            fCenG = (fCenG * 2 + cenG * 8) / 10;
            fCenB = (fCenB * 2 + cenB * 8) / 10;

            fDerR = (fDerR * 2 + derR * 8) / 10;
            fDerG = (fDerG * 2 + derG * 8) / 10;
            fDerB = (fDerB * 2 + derB * 8) / 10;
          }

          static uint32_t lastSendIzq = 0;
          static uint32_t lastSendDer = 0;
          static uint32_t lastSendCen = 0;
          static uint32_t lastSendSup = 0;
          static uint32_t lastForceSend = 0;
          bool force = (millis() - lastForceSend > 2500);

          // Control de tasa de 70ms por bombilla: cambio instantaneo sin saturar la red Wi-Fi
          if ((force || abs(fIzqR - pIzqR) >= 6 || abs(fIzqG - pIzqG) >= 6 || abs(fIzqB - pIzqB) >= 6) && (millis() - lastSendIzq >= 70 || force)) {
            id(enviar_color_ha)->execute("light.comedor_luces_izquierda", fIzqR, fIzqG, fIzqB);
            pIzqR = fIzqR; pIzqG = fIzqG; pIzqB = fIzqB;
            lastSendIzq = millis();
          }
          if ((force || abs(fDerR - pDerR) >= 6 || abs(fDerG - pDerG) >= 6 || abs(fDerB - pDerB) >= 6) && (millis() - lastSendDer >= 70 || force)) {
            id(enviar_color_ha)->execute("light.comedor_luces_derecha", fDerR, fDerG, fDerB);
            pDerR = fDerR; pDerG = fDerG; pDerB = fDerB;
            lastSendDer = millis();
          }
          if ((force || abs(fCenR - pCenR) >= 6 || abs(fCenG - pCenG) >= 6 || abs(fCenB - pCenB) >= 6) && (millis() - lastSendCen >= 70 || force)) {
            id(enviar_color_ha)->execute("light.comedor_luces_centro", fCenR, fCenG, fCenB);
            pCenR = fCenR; pCenG = fCenG; pCenB = fCenB;
            lastSendCen = millis();
          }

          if (id(activar_techo).state) {
            if ((force || abs(fSupR - pSupR) >= 6 || abs(fSupG - pSupG) >= 6 || abs(fSupB - pSupB) >= 6) && (millis() - lastSendSup >= 70 || force)) {
              id(enviar_color_ha)->execute("light.comedor_luces_techo", fSupR, fSupG, fSupB);
              pSupR = fSupR; pSupG = fSupG; pSupB = fSupB;
              lastSendSup = millis();
            }
          }
          if (force) lastForceSend = millis();

          static uint32_t tLog = 0;
          if (millis() - tLog >= 1000) {
            ESP_LOGI("ambilight", "LEDs: %d | L0(G:%d,R:%d,B:%d) L1(G:%d,R:%d,B:%d) | IZQ(R:%d,G:%d,B:%d) CEN(R:%d,G:%d,B:%d) DER(R:%d,G:%d,B:%d)",
                     ledsLeidos,
                     ledData[0], ledData[1], ledData[2],
                     ledData[3], ledData[4], ledData[5],
                     fIzqR, fIzqG, fIzqB, fCenR, fCenG, fCenB, fDerR, fDerG, fDerB);
            tLog = millis();
          }

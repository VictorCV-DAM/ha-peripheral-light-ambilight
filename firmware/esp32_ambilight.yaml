# Board: ESP32-C3 DevKitM-1 (Espressif RISC-V 160MHz)
esphome:
  name: esp32-ambiligth
  friendly_name: Ambilight Govee Bridge
  includes:
    - govee_sniffer.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          float val = id(velocidad_transicion).state;
          if (isnan(val)) val = 0.0f;
          float lat = 65.0f + (val * 1000.0f);
          id(latencia_estimada).publish_state(lat);
          id(latencia_media_registrada).publish_state(lat);
          if (!id(govee_hardware_state).has_state()) {
            id(govee_signal_active).publish_state(false);
            id(govee_hardware_state).publish_state("Standby");
          }

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  reboot_timeout: 0s
  encryption:
    key: "87R9C1MCPvg8ijQB5aM+enPk26Hbs51ah0OtsMBNv6w="

safe_mode:
  disabled: true

ota:
  - platform: esphome

wifi:
  ssid: "PAGAtuWIFI"
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: false
  manual_ip:
    static_ip: 192.168.1.49
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1
  reboot_timeout: 3min

button:
  - platform: restart
    name: "Restart ESP32"
    id: reiniciar_esp32
    icon: "mdi:restart"

  - platform: template
    name: "View Live Logs"
    id: btn_abrir_registros
    icon: "mdi:console-network"
    on_press:
      - homeassistant.service:
          service: script.ver_pantalla_de_registros

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode:
        input: true
        pulldown: true
    id: pin_datos
    internal: true

  - platform: template
    name: "Govee Signal Active"
    id: govee_signal_active
    device_class: running
    icon: "mdi:television-ambient-light"

text_sensor:
  - platform: template
    name: "Govee Hardware State"
    id: govee_hardware_state
    icon: "mdi:television-shimmer"

sensor:
  - platform: template
    name: "Estimated Latency"
    id: latencia_estimada
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    icon: "mdi:timer-outline"
    state_class: measurement

  - platform: template
    name: "Average Latency (20s)"
    id: latencia_media_registrada
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    icon: "mdi:chart-timeline-variant"
    state_class: measurement

globals:
  - id: test_en_curso
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: lat_sum
    type: float
    initial_value: '0.0'
  - id: lat_count
    type: uint32_t
    initial_value: '0'

switch:
  - platform: template
    name: "1. Ambilight Mode"
    id: modo_ambilight
    icon: "mdi:television-ambient-light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "3. Ceiling Light"
    id: activar_techo
    icon: "mdi:ceiling-light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "4. Blackout Mode"
    id: modo_blackout
    icon: "mdi:lightbulb-off-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Rotation: Invert Direction"
    id: invertir_sentido
    icon: "mdi:rotate-left-variant"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: template
    name: "2. Transition Speed"
    id: velocidad_transicion
    unit_of_measurement: "s"
    icon: "mdi:transition"
    min_value: 0.0
    max_value: 1.5
    step: 0.05
    initial_value: 0.0
    mode: slider
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          float val = id(velocidad_transicion).state;
          float lat = 65.0f + (val * 1000.0f);
          id(latencia_estimada).publish_state(lat);

  - platform: template
    name: "Edge 1 - Left (LEDs)"
    id: num_leds_izq
    icon: "mdi:arrow-left-bold-box-outline"
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 2 - Top (LEDs)"
    id: num_leds_sup
    icon: "mdi:arrow-up-bold-box-outline"
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 3 - Right (LEDs)"
    id: num_leds_der
    icon: "mdi:arrow-right-bold-box-outline"
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 4 - Bottom (LEDs)"
    id: num_leds_inf
    icon: "mdi:arrow-down-bold-box-outline"
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Rotation: 360° Angle"
    id: rotacion_offset
    unit_of_measurement: "°"
    icon: "mdi:rotate-360"
    min_value: -180
    max_value: 180
    step: 1
    initial_value: 0
    mode: slider
    optimistic: true
    restore_value: true

script:
  - id: enviar_color_ha
    mode: parallel
    max_runs: 10
    parameters:
      entidad: string
      r: int
      g: int
      b: int
      trans: float
    then:
      - lambda: |-
          ESP_LOGD("ha_send", "EVENT -> %s: R=%d G=%d B=%d (trans=%.2fs)", entidad.c_str(), r, g, b, trans);
      - homeassistant.event:
          event: esphome.ambilight_color
          data:
            entity_id: !lambda "return entidad;"
            r: !lambda "return std::to_string(r);"
            g: !lambda "return std::to_string(g);"
            b: !lambda "return std::to_string(b);"
            transition: !lambda 'return str_sprintf("%.2f", trans);'

interval:
  - interval: 20s
    then:
      - lambda: |-
          if (id(lat_count) > 0) {
            float avg = id(lat_sum) / (float)id(lat_count);
            id(latencia_media_registrada).publish_state(roundf(avg));
          } else {
            float base = 65.0f + (id(velocidad_transicion).state * 1000.0f);
            id(latencia_media_registrada).publish_state(roundf(base));
          }
          id(lat_sum) = 0.0f;
          id(lat_count) = 0;

  - interval: 40ms
    then:
      - lambda: |-
          static int fIzqR = -1, fIzqG = -1, fIzqB = -1;
          static int fSupR = -1, fSupG = -1, fSupB = -1;
          static int fCenR = -1, fCenG = -1, fCenB = -1;
          static int fDerR = -1, fDerG = -1, fDerB = -1;

          static int pIzqR = -1, pIzqG = -1, pIzqB = -1;
          static int pSupR = -1, pSupG = -1, pSupB = -1;
          static int pCenR = -1, pCenG = -1, pCenB = -1;
          static int pDerR = -1, pDerG = -1, pDerB = -1;

          auto median3 = [](int a, int b, int c) -> int {
            if ((a <= b && b <= c) || (c <= b && b <= a)) return b;
            if ((b <= a && a <= c) || (c <= a && a <= b)) return a;
            return c;
          };

          static int hIzqR[3] = {-1, -1, -1}, hIzqG[3] = {-1, -1, -1}, hIzqB[3] = {-1, -1, -1};
          static int hSupR[3] = {-1, -1, -1}, hSupG[3] = {-1, -1, -1}, hSupB[3] = {-1, -1, -1};
          static int hDerR[3] = {-1, -1, -1}, hDerG[3] = {-1, -1, -1}, hDerB[3] = {-1, -1, -1};
          static int hCenR[3] = {-1, -1, -1}, hCenG[3] = {-1, -1, -1}, hCenB[3] = {-1, -1, -1};
          static int hIdx = 0;

          static uint32_t tDiag = 0;
          if (id(test_en_curso)) {
            return;
          }

          static uint32_t lastValidFrameTime = 0;
          static uint32_t prevFrameTime = 0;
          static uint32_t lastFrameInterval = 0;
          static bool currentSignalActive = false;
          static std::string currentMode = "Standby";
          static std::string previousActiveMode = "Vídeo";
          static int consecutiveVideoFrames = 0;
          static int consecutiveStaticFrames = 0;
          static int consecutiveStrongVideoFrames = 0;

          uint32_t now = millis();
          uint32_t tLoopStart = now;

          const int MAX_LEDS = 37;
          uint8_t ledData[MAX_LEDS * 3] = {0};

          int ledsLeidos = capture_govee_frame(ledData, MAX_LEDS);

          if (ledsLeidos >= 37) {
            lastValidFrameTime = now;
            if (prevFrameTime > 0) {
              lastFrameInterval = now - prevFrameTime;
            }
            prevFrameTime = now;
          } else {
            // Si la línea está en silencio más de 5s -> Standby automático:
            if (now - lastValidFrameTime > 5000) {
              if (currentMode != "Standby") {
                ESP_LOGW("mode", "CAMBIO DE ESTADO: %s -> Standby (sin señal > 5s)", currentMode.c_str());
                currentMode = "Standby";
                currentSignalActive = false;
                consecutiveVideoFrames = 0;
                consecutiveStaticFrames = 0;
                consecutiveStrongVideoFrames = 0;
                id(govee_signal_active).publish_state(false);
                id(govee_hardware_state).publish_state("Standby");
              }
              hIzqR[0] = -1;
            }
            return;
          }

          float rotDeg = id(rotacion_offset).state;
          int offset = (int)roundf(rotDeg * 36.0f / 360.0f);
          bool invert = id(invertir_sentido).state;
          int nIzq = (int)id(num_leds_izq).state;
          int nSup = (int)id(num_leds_sup).state;
          int nDer = (int)id(num_leds_der).state;
          int nInf = (int)id(num_leds_inf).state;

          const int TOTAL_LEDS_LOOP = 36;

          auto getLedIndex = [&](int virtualPos) -> int {
            int pos = virtualPos % TOTAL_LEDS_LOOP;
            if (invert) {
              pos = (TOTAL_LEDS_LOOP * 10 + offset - pos) % TOTAL_LEDS_LOOP;
            } else {
              pos = (TOTAL_LEDS_LOOP * 10 + pos + offset) % TOTAL_LEDS_LOOP;
            }
            return 1 + pos;
          };

          // WS2811 GRB: Byte 0 = G, Byte 1 = R, Byte 2 = B
          // A. Zona Izquierda
          long sR_izq = 0, sG_izq = 0, sB_izq = 0;
          for (int i = 0; i < nIzq; i++) {
            int k = getLedIndex(i);
            sG_izq += ledData[k * 3 + 0];
            sR_izq += ledData[k * 3 + 1];
            sB_izq += ledData[k * 3 + 2];
          }
          int izqR = sR_izq / nIzq;
          int izqG = sG_izq / nIzq;
          int izqB = sB_izq / nIzq;

          // B. Zona Techo (Borde Superior)
          int startSupVirt = nIzq;
          long sR_sup = 0, sG_sup = 0, sB_sup = 0;
          for (int i = startSupVirt; i < startSupVirt + nSup; i++) {
            int k = getLedIndex(i);
            sG_sup += ledData[k * 3 + 0];
            sR_sup += ledData[k * 3 + 1];
            sB_sup += ledData[k * 3 + 2];
          }
          int supR = (nSup > 0) ? (sR_sup / nSup) : 0;
          int supG = (nSup > 0) ? (sG_sup / nSup) : 0;
          int supB = (nSup > 0) ? (sB_sup / nSup) : 0;

          // C. Zona Derecha
          int startDerVirt = nIzq + nSup;
          long sR_der = 0, sG_der = 0, sB_der = 0;
          for (int i = startDerVirt; i < startDerVirt + nDer; i++) {
            int k = getLedIndex(i);
            sG_der += ledData[k * 3 + 0];
            sR_der += ledData[k * 3 + 1];
            sB_der += ledData[k * 3 + 2];
          }
          int derR = sR_der / nDer;
          int derG = sG_der / nDer;
          int derB = sB_der / nDer;

          // D. Zona Centro (Borde Inferior / Mesa)
          int startInfVirt = startDerVirt + nDer;
          if (nInf < 1) nInf = 1;

          long sR_cen = 0, sG_cen = 0, sB_cen = 0;
          for (int i = startInfVirt; i < startInfVirt + nInf; i++) {
            int k = getLedIndex(i);
            sG_cen += ledData[k * 3 + 0];
            sR_cen += ledData[k * 3 + 1];
            sB_cen += ledData[k * 3 + 2];
          }
          int cenR = sR_cen / nInf;
          int cenG = sG_cen / nInf;
          int cenB = sB_cen / nInf;

          // Filtrado de Mediana 3-Tap:
          // En cable único sin GND, el ruido por oscilación capacitiva o armónicos de 50Hz altera a veces
          // un único fotograma aislado. Un filtro de mediana de 3 muestras elimina con un 100% de eficacia
          // cualquier salto, bit-flip o glitch transitorio de 1 frame, sin alterar la fidelidad cromática
          // ni introducir desincronización entre zonas durante vídeo real:
          if (hIzqR[0] < 0) {
            for (int j = 0; j < 3; j++) {
              hIzqR[j] = izqR; hIzqG[j] = izqG; hIzqB[j] = izqB;
              hSupR[j] = supR; hSupG[j] = supG; hSupB[j] = supB;
              hDerR[j] = derR; hDerG[j] = derG; hDerB[j] = derB;
              hCenR[j] = cenR; hCenG[j] = cenG; hCenB[j] = cenB;
            }
          } else {
            hIzqR[hIdx] = izqR; hIzqG[hIdx] = izqG; hIzqB[hIdx] = izqB;
            hSupR[hIdx] = supR; hSupG[hIdx] = supG; hSupB[hIdx] = supB;
            hDerR[hIdx] = derR; hDerG[hIdx] = derG; hDerB[hIdx] = derB;
            hCenR[hIdx] = cenR; hCenG[hIdx] = cenG; hCenB[hIdx] = cenB;
            hIdx = (hIdx + 1) % 3;
          }

          izqR = median3(hIzqR[0], hIzqR[1], hIzqR[2]);
          izqG = median3(hIzqG[0], hIzqG[1], hIzqG[2]);
          izqB = median3(hIzqB[0], hIzqB[1], hIzqB[2]);

          supR = median3(hSupR[0], hSupR[1], hSupR[2]);
          supG = median3(hSupG[0], hSupG[1], hSupG[2]);
          supB = median3(hSupB[0], hSupB[1], hSupB[2]);

          derR = median3(hDerR[0], hDerR[1], hDerR[2]);
          derG = median3(hDerG[0], hDerG[1], hDerG[2]);
          derB = median3(hDerB[0], hDerB[1], hDerB[2]);

          cenR = median3(hCenR[0], hCenR[1], hCenR[2]);
          cenG = median3(hCenG[0], hCenG[1], hCenG[2]);
          cenB = median3(hCenB[0], hCenB[1], hCenB[2]);

          // Compresión cromática suave para escenas dominantemente rojas:
          // En escenas rojas de TV, la cámara Govee capta bleed óptico de verde (G=35..60).
          // En tiras LED RGB como la del comedor, ese verde residual enciende los LEDs verdes
          // provocando un microparpadeo amarillento.
          // Aplicamos una curva polinómica cúbica suave (sin saltos ni umbrales duros)
          // que atenúa el ruido de G por debajo de 80 cuando R domina netamente.
          auto smoothRedPurity = [](int &r, int &g, int &b) {
            if (r >= 90 && b < 50 && g < 80 && (r > g * 2)) {
              float rg = (float)g / 80.0f;
              g = (int)(g * rg * rg);
              if (b < 35) {
                float rb = (float)b / 35.0f;
                b = (int)(b * rb * rb);
              }
            }
          };

          smoothRedPurity(izqR, izqG, izqB);
          smoothRedPurity(supR, supG, supB);
          smoothRedPurity(derR, derG, derB);
          smoothRedPurity(cenR, cenG, cenB);

          // Detección del estado real del hardware (Vídeo vs Estático vs Standby)
          int maxOverall = std::max({izqR, izqG, izqB, supR, supG, supB, derR, derG, derB, cenR, cenG, cenB});
          bool isBlack = (maxOverall <= 4);

          // Dispersión cromática y espacial:
          // 1. rawSpread: diferencia directa de brillo y color entre bordes (milestone da7c289).
          int maxR = std::max({izqR, supR, derR, cenR});
          int minR = std::min({izqR, supR, derR, cenR});
          int maxG = std::max({izqG, supG, derG, cenG});
          int minG = std::min({izqG, supG, derG, cenG});
          int maxB = std::max({izqB, supB, derB, cenB});
          int minB = std::min({izqB, supB, derB, cenB});
          int rawSpread = (maxR - minR) + (maxG - minG) + (maxB - minB);

          // 2. chromaSpread: proporción cromática normalizada a 255.
          int normR[4], normG[4], normB[4];
          int validZones = 0;
          int zR[4] = {izqR, supR, derR, cenR};
          int zG[4] = {izqG, supG, derG, cenG};
          int zB[4] = {izqB, supB, derB, cenB};
          for (int z = 0; z < 4; z++) {
            int m = std::max({zR[z], zG[z], zB[z]});
            if (m >= 15) {
              normR[validZones] = (zR[z] * 255) / m;
              normG[validZones] = (zG[z] * 255) / m;
              normB[validZones] = (zB[z] * 255) / m;
              validZones++;
            }
          }
          int chromaSpread = 0;
          if (validZones >= 2) {
            int maxNR = normR[0], minNR = normR[0];
            int maxNG = normG[0], minNG = normG[0];
            int maxNB = normB[0], minNB = normB[0];
            for (int z = 1; z < validZones; z++) {
              maxNR = std::max(maxNR, normR[z]); minNR = std::min(minNR, normR[z]);
              maxNG = std::max(maxNG, normG[z]); minNG = std::min(minNG, normG[z]);
              maxNB = std::max(maxNB, normB[z]); minNB = std::min(minNB, normB[z]);
            }
            chromaSpread = (maxNR - minNR) + (maxNG - minNG) + (maxNB - minNB);
          }

          int totalSpread = std::max(rawSpread, chromaSpread);

          static int prevRawIzqR = -1, prevRawIzqG = -1, prevRawIzqB = -1;
          static int prevRawSupR = -1, prevRawSupG = -1, prevRawSupB = -1;
          static int prevRawDerR = -1, prevRawDerG = -1, prevRawDerB = -1;
          static int prevRawCenR = -1, prevRawCenG = -1, prevRawCenB = -1;

          int tempDelta = (prevRawIzqR < 0) ? 0 :
                          (abs(izqR - prevRawIzqR) + abs(izqG - prevRawIzqG) + abs(izqB - prevRawIzqB) +
                           abs(supR - prevRawSupR) + abs(supG - prevRawSupG) + abs(supB - prevRawSupB) +
                           abs(derR - prevRawDerR) + abs(derG - prevRawDerG) + abs(derB - prevRawDerB) +
                           abs(cenR - prevRawCenR) + abs(cenG - prevRawCenG) + abs(cenB - prevRawCenB));

          // Detección y neutralización de micro-glitches de bus y micro-cortes de 50Hz sin GND:
          static int consecutiveBlackFrames = 0;
          if (isBlack) {
            consecutiveBlackFrames++;
          } else {
            consecutiveBlackFrames = 0;
          }

          // Si veníamos con señal encendida y cae a 0 durante solo 1..2 fotogramas (<90ms),
          // es un micro-corte por oscilación de masa flotante, NO un apagado real.
          bool isTransientBlackDrop = (isBlack && consecutiveBlackFrames <= 2 && prevRawIzqR >= 0);

          if (!isBlack) {
            prevRawIzqR = izqR; prevRawIzqG = izqG; prevRawIzqB = izqB;
            prevRawSupR = supR; prevRawSupG = supG; prevRawSupB = supB;
            prevRawDerR = derR; prevRawDerG = derG; prevRawDerB = derB;
            prevRawCenR = cenR; prevRawCenG = cenG; prevRawCenB = cenB;
          }

          // Salida de Standby por señal activa sostenida (>300ms de datos válidos no-negro):
          static int consecutiveAwakeFrames = 0;
          if (isBlack) {
            consecutiveAwakeFrames = 0;
          } else {
            consecutiveAwakeFrames++;
          }
          consecutiveAwakeFrames = std::min(consecutiveAwakeFrames, 100);

          // Integrador Leaky-Bucket Asimétrico con límites de saturación:
          static uint32_t lastVideoActivityTime = 0;
          int spatialContrast = 0;
          bool isPerimeterUniform = false;

          if (isTransientBlackDrop) {
            // Ignorar micro-corte de 1..3 frames sin destruir sF ni vF
          } else if (isBlack) {
            if (consecutiveVideoFrames > 0) consecutiveVideoFrames--;
            if (consecutiveStaticFrames > 0) consecutiveStaticFrames--;
          } else {
            // Contraste espacial perimetral directo:
            int dColorLR = abs(izqR - derR) + abs(izqG - derG) + abs(izqB - derB);
            int dColorTC = abs(supR - cenR) + abs(supG - cenG) + abs(supB - cenB);
            spatialContrast = std::max(dColorLR, dColorTC);

            // Detección de Dinamismo y Dispersión Calibrada:
            // 1. hasSpatialDiversity: Contraste multizona real (los lados opuestos tienen colores diferentes).
            //    En estático puro o color fijo: dColorLR <= 10. En vídeo multizona: dColorLR >= 35..250.
            bool hasSpatialDiversity = (dColorLR >= 35 || (dColorLR >= 20 && dColorTC >= 50) || dColorTC >= 100);

            // 2. isPerimeterUniform: El perímetro es 100% homogéneo y congelado a nivel de hardware.
            //    En modo Color/Estático de la app Govee, todos los 36 LEDs tienen el mismo color y cero ruido de cámara (rawSpread <= 10 y tempDelta <= 10).
            isPerimeterUniform = (rawSpread <= 10 && tempDelta <= 10);

            // 3. hasMotion: Movimiento temporal continuo.
            //    CRÍTICO: Si el perímetro es uniforme (spatialContrast < 20), cualquier cambio temporal
            //    proviene de un ajuste del control deslizante de color/brillo en la app Govee (modo estático),
            //    ¡NUNCA de vídeo! Solo es movimiento de vídeo si coexiste con contraste espacial.
            bool hasMotion = (tempDelta >= 28 && spatialContrast >= 20);

            // 4. isVideoActivity: Hay actividad si hay contraste espacial multizona O movimiento con contraste.
            bool isVideoActivity = (hasSpatialDiversity || hasMotion);

            // 5. isTrulyStatic: Es estático si el perímetro se mantiene uniforme y congelado.
            bool isTrulyStatic = isPerimeterUniform;

            if (hasSpatialDiversity) {
              consecutiveStrongVideoFrames++;
            } else {
              if (consecutiveStrongVideoFrames > 0) consecutiveStrongVideoFrames--;
            }
            consecutiveStrongVideoFrames = std::min(consecutiveStrongVideoFrames, 50);

            if (isVideoActivity) {
              consecutiveVideoFrames++;
              if (consecutiveVideoFrames >= 3) {
                lastVideoActivityTime = now;
              }
            } else {
              if (consecutiveVideoFrames > 0) {
                consecutiveVideoFrames--;
              }
            }

            if (isTrulyStatic) {
              consecutiveStaticFrames++;
            } else {
              consecutiveStaticFrames = 0;
            }
          }

          // Evitar desbordamiento de contadores:
          consecutiveVideoFrames = std::min(consecutiveVideoFrames, 100);
          consecutiveStaticFrames = std::min(consecutiveStaticFrames, 600);
          consecutiveBlackFrames = std::min(consecutiveBlackFrames, 150);

          std::string targetCandidate = currentMode;

          if (currentMode == "Standby") {
            // Salida de Standby al detectar luz/señal continua (>20 frames encendidos ~800ms):
            if (!isBlack && consecutiveAwakeFrames >= 20) {
              if (consecutiveStrongVideoFrames >= 10 || consecutiveVideoFrames >= 20) {
                targetCandidate = "Vídeo";
              } else if (isPerimeterUniform && consecutiveStaticFrames >= 20) {
                targetCandidate = "Estático";
              } else {
                targetCandidate = previousActiveMode;
              }
            }
          } else if (currentMode == "Estático") {
            // Estando en Estático:
            if (consecutiveBlackFrames >= 100) {
              // Pantalla/tira apagada en negro durante ~4.0s -> Standby
              targetCandidate = "Standby";
            } else if (consecutiveStrongVideoFrames >= 15 || consecutiveVideoFrames >= 35) {
              // Con 15 frames (~600ms) de contraste multizona fuerte O 35 frames (~1.4s) de contraste continuo conmuta a Vídeo.
              // Los cambios de color/brillo en la app Govee tienen spatialContrast < 20, por lo que nunca conmutan a Vídeo.
              targetCandidate = "Vídeo";
            }
          } else if (currentMode == "Vídeo") {
            // Estando en Vídeo:
            if (consecutiveBlackFrames >= 100) {
              // ~4.0s de negro absoluto sostenido -> Standby
              targetCandidate = "Standby";
            } else if (consecutiveStaticFrames >= 500 && (now - lastVideoActivityTime >= 20000)) {
              // Transición a Estático: exige 20.0s (500 frames) continuos de congelamiento total
              // en todos los 36 LEDs (rawSpread <= 10 y tempDelta <= 10).
              // Físicamente IMPOSIBLE de alcanzar durante una película o programa de TV,
              // blindando el modo Vídeo para que NUNCA vuelva a caer a Estático mientras ves la tele.
              targetCandidate = "Estático";
            }
          }

          if (targetCandidate != currentMode || id(govee_hardware_state).state != currentMode) {
            if (targetCandidate != currentMode) {
              ESP_LOGW("mode", "CAMBIO DE ESTADO: %s -> %s (contrast=%d, dt=%d, vF=%d, sF=%d, bF=%d)",
                       currentMode.c_str(), targetCandidate.c_str(), spatialContrast, tempDelta,
                       consecutiveVideoFrames, consecutiveStaticFrames, consecutiveBlackFrames);
              currentMode = targetCandidate;
              currentSignalActive = (currentMode != "Standby");
              if (currentMode != "Standby") {
                previousActiveMode = currentMode;
              }
              consecutiveVideoFrames = 0;
              consecutiveStaticFrames = 0;
              consecutiveBlackFrames = 0;
            }
            id(govee_hardware_state).publish_state(currentMode);
            id(govee_signal_active).publish_state(currentSignalActive);
          }

          static uint32_t lastDiagPrint = 0;
          if (now - lastDiagPrint >= 2000) {
            ESP_LOGI("mode", "Govee Hardware: %s (contrast=%d, dt=%d, vF=%d, sF=%d, bF=%d)",
                     currentMode.c_str(), spatialContrast, tempDelta,
                     consecutiveVideoFrames, consecutiveStaticFrames, consecutiveBlackFrames);
            lastDiagPrint = now;
          }

          // Si el interruptor del puente está APAGADO en Home Assistant,
          // no enviamos nada a las bombillas secundarias (el hardware queda monitorizado sin alterar nada).
          if (!id(modo_ambilight).state) {
            fIzqR = -1; fSupR = -1; fCenR = -1; fDerR = -1;
            pIzqR = -1; pSupR = -1; pCenR = -1; pDerR = -1;
            hIzqR[0] = -1;
            if (millis() - tDiag >= 3000) {
              ESP_LOGI("sniffer", "PAUSADO: Modo Ambilight está APAGADO en Home Assistant.");
              tDiag = millis();
            }
            return;
          }

          // En cable único sin GND, si hay micro-corte transitorio (<160ms), no actualizamos bombillas:
          if (isTransientBlackDrop) {
            return;
          }

          // Suavizado temporal IIR adaptativo:
          // Para micro-variaciones y oscilaciones de balance de blancos de la cámara (< 28),
          // aplica filtrado profundo (7/8) que estabiliza por completo tonos pasteles y neutros (rosado vs blanquecino).
          // Para transiciones reales de escena (>= 28), aplica respuesta rápida (3/4).
          auto smoothAdaptive = [](int currentF, int newTarget) -> int {
            if (currentF < 0) return newTarget;
            int diff = abs(newTarget - currentF);
            if (diff < 28) {
              return (currentF * 7 + newTarget + 4) / 8;
            } else {
              return (currentF * 3 + newTarget + 2) / 4;
            }
          };

          // Detección de zonas en negro (calibrada para sesgo óptico de cámara en escenas oscuras):
          bool blackIzq = (izqR <= 14 && izqG <= 14 && izqB <= 14);
          bool blackDer = (derR <= 14 && derG <= 14 && derB <= 14);
          bool blackCen = (cenR <= 14 && cenG <= 14 && cenB <= 14);
          bool blackSup = (supR <= 14 && supG <= 14 && supB <= 14);

          if (id(modo_blackout).state) {
            // En Blackout Mode activo: si la zona cae a negro, cae a 0 de inmediato (0ms de retraso)
            // sin esperar a que el filtro IIR decaiga lentamente a lo largo de 20 fotogramas.
            if (blackIzq) { fIzqR = 0; fIzqG = 0; fIzqB = 0; }
            else {
              fIzqR = (pIzqR <= 4) ? izqR : smoothAdaptive(fIzqR, izqR);
              fIzqG = (pIzqG <= 4) ? izqG : smoothAdaptive(fIzqG, izqG);
              fIzqB = (pIzqB <= 4) ? izqB : smoothAdaptive(fIzqB, izqB);
            }

            if (blackDer) { fDerR = 0; fDerG = 0; fDerB = 0; }
            else {
              fDerR = (pDerR <= 4) ? derR : smoothAdaptive(fDerR, derR);
              fDerG = (pDerG <= 4) ? derG : smoothAdaptive(fDerG, derG);
              fDerB = (pDerB <= 4) ? derB : smoothAdaptive(fDerB, derB);
            }

            if (blackCen) { fCenR = 0; fCenG = 0; fCenB = 0; }
            else {
              fCenR = (pCenR <= 4) ? cenR : smoothAdaptive(fCenR, cenR);
              fCenG = (pCenG <= 4) ? cenG : smoothAdaptive(fCenG, cenG);
              fCenB = (pCenB <= 4) ? cenB : smoothAdaptive(fCenB, cenB);
            }

            if (blackSup) { fSupR = 0; fSupG = 0; fSupB = 0; }
            else {
              fSupR = (pSupR <= 4) ? supR : smoothAdaptive(fSupR, supR);
              fSupG = (pSupG <= 4) ? supG : smoothAdaptive(fSupG, supG);
              fSupB = (pSupB <= 4) ? supB : smoothAdaptive(fSupB, supB);
            }
          } else {
            if (fIzqR < 0) {
              fIzqR = izqR; fIzqG = izqG; fIzqB = izqB;
              fSupR = supR; fSupG = supG; fSupB = supB;
              fCenR = cenR; fCenG = cenG; fCenB = cenB;
              fDerR = derR; fDerG = derG; fDerB = derB;
            } else {
              fIzqR = smoothAdaptive(fIzqR, izqR);
              fIzqG = smoothAdaptive(fIzqG, izqG);
              fIzqB = smoothAdaptive(fIzqB, izqB);

              fSupR = smoothAdaptive(fSupR, supR);
              fSupG = smoothAdaptive(fSupG, supG);
              fSupB = smoothAdaptive(fSupB, supB);

              fCenR = smoothAdaptive(fCenR, cenR);
              fCenG = smoothAdaptive(fCenG, cenG);
              fCenB = smoothAdaptive(fCenB, cenB);

              fDerR = smoothAdaptive(fDerR, derR);
              fDerG = smoothAdaptive(fDerG, derG);
              fDerB = smoothAdaptive(fDerB, derB);
            }
          }

          static uint32_t lastSendIzq = 0;
          static uint32_t lastSendDer = 0;
          static uint32_t lastSendCen = 0;
          static uint32_t lastSendSup = 0;
          static uint32_t lastForceSend = 0;

          now = millis();
          bool force = (now - lastForceSend > 15000);

          float trans = id(velocidad_transicion).state;
          uint32_t minInterval = 100;
          if (trans > 0.01f) {
            minInterval = (uint32_t)(trans * 1000.0f) + 40;
            if (minInterval < 100) minInterval = 100;
          }

          bool sentAny = false;

          // Eventos de apagado en negro (Blackout en tiempo real):
          bool isBlackTarget_izq = (fIzqR <= 4 && fIzqG <= 4 && fIzqB <= 4);
          bool wasBlack_izq = (pIzqR <= 4 && pIzqG <= 4 && pIzqB <= 4);
          bool blackoutEvent_izq = (id(modo_blackout).state && (isBlackTarget_izq != wasBlack_izq));

          int dR_izq = abs(fIzqR - pIzqR);
          int dG_izq = abs(fIzqG - pIzqG);
          int dB_izq = abs(fIzqB - pIzqB);
          bool chgIzq = (dR_izq >= 18 || dG_izq >= 18 || dB_izq >= 18 || (dR_izq + dG_izq + dB_izq >= 28) || blackoutEvent_izq);
          if ((chgIzq || (force && (dR_izq >= 4 || dG_izq >= 4 || dB_izq >= 4))) &&
              (now - lastSendIzq >= minInterval || (force && chgIzq) || blackoutEvent_izq)) {
            id(enviar_color_ha)->execute("light.comedor_luces_izquierda", fIzqR, fIzqG, fIzqB, trans);
            pIzqR = fIzqR; pIzqG = fIzqG; pIzqB = fIzqB;
            lastSendIzq = now;
            sentAny = true;
          }

          bool isBlackTarget_der = (fDerR <= 4 && fDerG <= 4 && fDerB <= 4);
          bool wasBlack_der = (pDerR <= 4 && pDerG <= 4 && pDerB <= 4);
          bool blackoutEvent_der = (id(modo_blackout).state && (isBlackTarget_der != wasBlack_der));

          int dR_der = abs(fDerR - pDerR);
          int dG_der = abs(fDerG - pDerG);
          int dB_der = abs(fDerB - pDerB);
          bool chgDer = (dR_der >= 18 || dG_der >= 18 || dB_der >= 18 || (dR_der + dG_der + dB_der >= 28) || blackoutEvent_der);
          if ((chgDer || (force && (dR_der >= 4 || dG_der >= 4 || dB_der >= 4))) &&
              (now - lastSendDer >= minInterval || (force && chgDer) || blackoutEvent_der)) {
            id(enviar_color_ha)->execute("light.comedor_luces_derecha", fDerR, fDerG, fDerB, trans);
            pDerR = fDerR; pDerG = fDerG; pDerB = fDerB;
            lastSendDer = now;
            sentAny = true;
          }

          bool isBlackTarget_cen = (fCenR <= 4 && fCenG <= 4 && fCenB <= 4);
          bool wasBlack_cen = (pCenR <= 4 && pCenG <= 4 && pCenB <= 4);
          bool blackoutEvent_cen = (id(modo_blackout).state && (isBlackTarget_cen != wasBlack_cen));

          int dR_cen = abs(fCenR - pCenR);
          int dG_cen = abs(fCenG - pCenG);
          int dB_cen = abs(fCenB - pCenB);
          bool chgCen = (dR_cen >= 18 || dG_cen >= 18 || dB_cen >= 18 || (dR_cen + dG_cen + dB_cen >= 28) || blackoutEvent_cen);
          if ((chgCen || (force && (dR_cen >= 4 || dG_cen >= 4 || dB_cen >= 4))) &&
              (now - lastSendCen >= minInterval || (force && chgCen) || blackoutEvent_cen)) {
            id(enviar_color_ha)->execute("light.comedor_luces_centro", fCenR, fCenG, fCenB, trans);
            pCenR = fCenR; pCenG = fCenG; pCenB = fCenB;
            lastSendCen = now;
            sentAny = true;
          }

          if (id(activar_techo).state) {
            bool isBlackTarget_sup = (fSupR <= 4 && fSupG <= 4 && fSupB <= 4);
            bool wasBlack_sup = (pSupR <= 4 && pSupG <= 4 && pSupB <= 4);
            bool blackoutEvent_sup = (id(modo_blackout).state && (isBlackTarget_sup != wasBlack_sup));

            int dR_sup = abs(fSupR - pSupR);
            int dG_sup = abs(fSupG - pSupG);
            int dB_sup = abs(fSupB - pSupB);
            bool chgSup = (dR_sup >= 18 || dG_sup >= 18 || dB_sup >= 18 || (dR_sup + dG_sup + dB_sup >= 28) || blackoutEvent_sup);
            if ((chgSup || (force && (dR_sup >= 4 || dG_sup >= 4 || dB_sup >= 4))) &&
                (now - lastSendSup >= minInterval || (force && chgSup) || blackoutEvent_sup)) {
              id(enviar_color_ha)->execute("light.comedor_luces_techo", fSupR, fSupG, fSupB, trans);
              pSupR = fSupR; pSupG = fSupG; pSupB = fSupB;
              lastSendSup = now;
              sentAny = true;
            }
          }
          if (force) lastForceSend = now;

          if (sentAny) {
            uint32_t elapsed = millis() - tLoopStart;
            float measuredLat = 65.0f + (float)elapsed + (trans * 1000.0f);
            id(lat_sum) += measuredLat;
            id(lat_count)++;
          }

          static uint32_t tLog = 0;
          if (millis() - tLog >= 1000) {
            ESP_LOGI("ambilight", "LEDs: %d | IZQ(R:%d,G:%d,B:%d) CEN(R:%d,G:%d,B:%d) DER(R:%d,G:%d,B:%d) | Trans: %.2fs (Lat: %.0fms)",
                     ledsLeidos,
                     fIzqR, fIzqG, fIzqB, fCenR, fCenG, fCenB, fDerR, fDerG, fDerB,
                     trans, 65.0f + (trans * 1000.0f));
            tLog = millis();
          }

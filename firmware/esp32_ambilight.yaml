# Board: ESP32-C3 DevKitM-1 (Espressif RISC-V 160MHz)
esphome:
  name: esp32-ambiligth
  friendly_name: Ambilight Govee Bridge
  includes:
    - govee_sniffer.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          float val = id(velocidad_transicion).state;
          if (isnan(val)) val = 0.0f;
          float lat = 65.0f + (val * 1000.0f);
          id(latencia_estimada).publish_state(lat);
          id(latencia_media_registrada).publish_state(lat);
          if (!id(govee_hardware_state).has_state()) {
            id(govee_signal_active).publish_state(false);
            id(govee_hardware_state).publish_state("Standby");
          }

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  reboot_timeout: 0s
  encryption:
    key: "87R9C1MCPvg8ijQB5aM+enPk26Hbs51ah0OtsMBNv6w="

safe_mode:
  disabled: true

ota:
  - platform: esphome

wifi:
  ssid: "PAGAtuWIFI"
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: false
  manual_ip:
    static_ip: 192.168.1.49
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1
  reboot_timeout: 3min

button:
  - platform: restart
    name: "Restart ESP32"
    id: reiniciar_esp32
    icon: "mdi:restart"

  - platform: template
    name: "View Live Logs"
    id: btn_abrir_registros
    icon: "mdi:console-network"
    on_press:
      - homeassistant.service:
          service: script.ver_pantalla_de_registros

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode:
        input: true
        pulldown: true
    id: pin_datos
    internal: true

  - platform: template
    name: "Govee Signal Active"
    id: govee_signal_active
    device_class: running
    icon: "mdi:television-ambient-light"

text_sensor:
  - platform: template
    name: "Govee Hardware State"
    id: govee_hardware_state
    icon: "mdi:television-shimmer"

sensor:
  - platform: template
    name: "Estimated Latency"
    id: latencia_estimada
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    icon: "mdi:timer-outline"
    state_class: measurement

  - platform: template
    name: "Average Latency (20s)"
    id: latencia_media_registrada
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    icon: "mdi:chart-timeline-variant"
    state_class: measurement

globals:
  - id: test_en_curso
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: lat_sum
    type: float
    initial_value: '0.0'
  - id: lat_count
    type: uint32_t
    initial_value: '0'

switch:
  - platform: template
    name: "1. Ambilight Mode"
    id: modo_ambilight
    icon: "mdi:television-ambient-light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "3. Ceiling Light"
    id: activar_techo
    icon: "mdi:ceiling-light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "4. Blackout Mode"
    id: modo_blackout
    icon: "mdi:lightbulb-off-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Rotation: Invert Direction"
    id: invertir_sentido
    icon: "mdi:rotate-left-variant"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: template
    name: "2. Transition Speed"
    id: velocidad_transicion
    unit_of_measurement: "s"
    icon: "mdi:transition"
    min_value: 0.0
    max_value: 1.5
    step: 0.05
    initial_value: 0.0
    mode: slider
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          float val = id(velocidad_transicion).state;
          float lat = 65.0f + (val * 1000.0f);
          id(latencia_estimada).publish_state(lat);

  - platform: template
    name: "Edge 1 - Left (LEDs)"
    id: num_leds_izq
    icon: "mdi:arrow-left-bold-box-outline"
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 2 - Top (LEDs)"
    id: num_leds_sup
    icon: "mdi:arrow-up-bold-box-outline"
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 3 - Right (LEDs)"
    id: num_leds_der
    icon: "mdi:arrow-right-bold-box-outline"
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 4 - Bottom (LEDs)"
    id: num_leds_inf
    icon: "mdi:arrow-down-bold-box-outline"
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Rotation: 360° Angle"
    id: rotacion_offset
    unit_of_measurement: "°"
    icon: "mdi:rotate-360"
    min_value: -180
    max_value: 180
    step: 1
    initial_value: 0
    mode: slider
    optimistic: true
    restore_value: true

script:
  - id: enviar_color_ha
    mode: parallel
    max_runs: 10
    parameters:
      entidad: string
      r: int
      g: int
      b: int
      trans: float
    then:
      - lambda: |-
          ESP_LOGD("ha_send", "EVENT -> %s: R=%d G=%d B=%d (trans=%.2fs)", entidad.c_str(), r, g, b, trans);
      - homeassistant.event:
          event: esphome.ambilight_color
          data:
            entity_id: !lambda "return entidad;"
            r: !lambda "return std::to_string(r);"
            g: !lambda "return std::to_string(g);"
            b: !lambda "return std::to_string(b);"
            transition: !lambda 'return str_sprintf("%.2f", trans);'

interval:
  - interval: 20s
    then:
      - lambda: |-
          if (id(lat_count) > 0) {
            float avg = id(lat_sum) / (float)id(lat_count);
            id(latencia_media_registrada).publish_state(roundf(avg));
          } else {
            float base = 65.0f + (id(velocidad_transicion).state * 1000.0f);
            id(latencia_media_registrada).publish_state(roundf(base));
          }
          id(lat_sum) = 0.0f;
          id(lat_count) = 0;

  - interval: 40ms
    then:
      - lambda: |-
          static int fIzqR = -1, fIzqG = -1, fIzqB = -1;
          static int fSupR = -1, fSupG = -1, fSupB = -1;
          static int fCenR = -1, fCenG = -1, fCenB = -1;
          static int fDerR = -1, fDerG = -1, fDerB = -1;

          static int pIzqR = -1, pIzqG = -1, pIzqB = -1;
          static int pSupR = -1, pSupG = -1, pSupB = -1;
          static int pCenR = -1, pCenG = -1, pCenB = -1;
          static int pDerR = -1, pDerG = -1, pDerB = -1;

          auto median5 = [](int a, int b, int c, int d, int e) -> int {
            int v[5] = {a, b, c, d, e};
            for (int i = 0; i < 3; i++) {
              for (int j = i + 1; j < 5; j++) {
                if (v[j] < v[i]) {
                  int tmp = v[i];
                  v[i] = v[j];
                  v[j] = tmp;
                }
              }
            }
            return v[2];
          };

          static int hIzqR[5] = {-1, -1, -1, -1, -1}, hIzqG[5] = {-1, -1, -1, -1, -1}, hIzqB[5] = {-1, -1, -1, -1, -1};
          static int hSupR[5] = {-1, -1, -1, -1, -1}, hSupG[5] = {-1, -1, -1, -1, -1}, hSupB[5] = {-1, -1, -1, -1, -1};
          static int hDerR[5] = {-1, -1, -1, -1, -1}, hDerG[5] = {-1, -1, -1, -1, -1}, hDerB[5] = {-1, -1, -1, -1, -1};
          static int hCenR[5] = {-1, -1, -1, -1, -1}, hCenG[5] = {-1, -1, -1, -1, -1}, hCenB[5] = {-1, -1, -1, -1, -1};
          static int hIdx = 0;

          static uint32_t tDiag = 0;
          if (id(test_en_curso)) {
            return;
          }

          static uint32_t lastValidFrameTime = 0;
          static uint32_t prevFrameTime = 0;
          static uint32_t lastFrameInterval = 0;
          static bool currentSignalActive = false;
          static std::string currentMode = "Standby";
          static std::string previousActiveMode = "Estático";
          static int consecutiveVideoFrames = 0;
          static int consecutiveStaticFrames = 0;
          static int consecutiveStrongVideoFrames = 0;

          uint32_t now = millis();
          uint32_t tLoopStart = now;

          const int MAX_LEDS = 37;
          uint8_t ledData[MAX_LEDS * 3] = {0};

          int ledsLeidos = capture_govee_frame(ledData, MAX_LEDS);

          if (ledsLeidos >= 37) {
            lastValidFrameTime = now;
            if (prevFrameTime > 0) {
              lastFrameInterval = now - prevFrameTime;
            }
            prevFrameTime = now;
          } else {
            // Si la línea está en silencio más de 5s -> Standby automático:
            if (now - lastValidFrameTime > 5000) {
              if (currentMode != "Standby") {
                ESP_LOGW("mode", "CAMBIO DE ESTADO: %s -> Standby (sin señal > 5s)", currentMode.c_str());
                currentMode = "Standby";
                currentSignalActive = false;
                consecutiveVideoFrames = 0;
                consecutiveStaticFrames = 0;
                consecutiveStrongVideoFrames = 0;
                id(govee_signal_active).publish_state(false);
                id(govee_hardware_state).publish_state("Standby");
              }
              hIzqR[0] = -1;
            }
            return;
          }

          float rotDeg = id(rotacion_offset).state;
          int offset = (int)roundf(rotDeg * 36.0f / 360.0f);
          bool invert = id(invertir_sentido).state;
          int nIzq = (int)id(num_leds_izq).state;
          int nSup = (int)id(num_leds_sup).state;
          int nDer = (int)id(num_leds_der).state;
          int nInf = (int)id(num_leds_inf).state;

          const int TOTAL_LEDS_LOOP = 36;

          auto getLedIndex = [&](int virtualPos) -> int {
            int pos = virtualPos % TOTAL_LEDS_LOOP;
            if (invert) {
              pos = (TOTAL_LEDS_LOOP * 10 + offset - pos) % TOTAL_LEDS_LOOP;
            } else {
              pos = (TOTAL_LEDS_LOOP * 10 + pos + offset) % TOTAL_LEDS_LOOP;
            }
            return 1 + pos;
          };

          // WS2811 GRB: Byte 0 = G, Byte 1 = R, Byte 2 = B
          // Mediana espacial por zona (promedia los 3 LEDs centrales tras ordenar cada borde):
          // En IZQ/DER (7 LEDs) descarta los 2 mínimos y 2 máximos; en SUP/CEN (11 LEDs) descarta
          // los 4 mínimos y 4 máximos, inmunizando cada zona aunque 2..4 LEDs sufran bit-slip de 50Hz.
          auto calcZoneTrimmed = [&](int startVirt, int count, int &outR, int &outG, int &outB) {
            if (count <= 0) { outR = 0; outG = 0; outB = 0; return; }
            int rArr[36], gArr[36], bArr[36];
            int n = std::min(count, 36);
            for (int i = 0; i < n; i++) {
              int k = getLedIndex(startVirt + i);
              gArr[i] = ledData[k * 3 + 0];
              rArr[i] = ledData[k * 3 + 1];
              bArr[i] = ledData[k * 3 + 2];
            }
            std::sort(rArr, rArr + n);
            std::sort(gArr, gArr + n);
            std::sort(bArr, bArr + n);
            if (n >= 5) {
              int mid = n / 2;
              outR = (rArr[mid - 1] + rArr[mid] + rArr[mid + 1]) / 3;
              outG = (gArr[mid - 1] + gArr[mid] + gArr[mid + 1]) / 3;
              outB = (bArr[mid - 1] + bArr[mid] + bArr[mid + 1]) / 3;
            } else if (n >= 3) {
              int mid = n / 2;
              outR = rArr[mid];
              outG = gArr[mid];
              outB = bArr[mid];
            } else {
              outR = rArr[0];
              outG = gArr[0];
              outB = bArr[0];
            }
          };

          // A. Zona Izquierda
          int izqR = 0, izqG = 0, izqB = 0;
          calcZoneTrimmed(0, nIzq, izqR, izqG, izqB);

          // B. Zona Techo (Borde Superior)
          int startSupVirt = nIzq;
          int supR = 0, supG = 0, supB = 0;
          calcZoneTrimmed(startSupVirt, nSup, supR, supG, supB);

          // C. Zona Derecha
          int startDerVirt = nIzq + nSup;
          int derR = 0, derG = 0, derB = 0;
          calcZoneTrimmed(startDerVirt, nDer, derR, derG, derB);

          // D. Zona Centro (Borde Inferior / Mesa)
          int startInfVirt = startDerVirt + nDer;
          if (nInf < 1) nInf = 1;
          int cenR = 0, cenG = 0, cenB = 0;
          calcZoneTrimmed(startInfVirt, nInf, cenR, cenG, cenB);

          // Filtrado de Mediana 5-Tap:
          // En cable único sin GND, el batimiento entre los 50Hz de red y el muestreo de 25Hz (40ms)
          // puede alterar hasta 2 fotogramas consecutivos. Un filtro de mediana de 5 muestras (200ms)
          // elimina el 100% de las ráfagas transitorias de 1 y 2 fotogramas sin alterar la fidelidad cromática:
          if (hIzqR[0] < 0) {
            for (int j = 0; j < 5; j++) {
              hIzqR[j] = izqR; hIzqG[j] = izqG; hIzqB[j] = izqB;
              hSupR[j] = supR; hSupG[j] = supG; hSupB[j] = supB;
              hDerR[j] = derR; hDerG[j] = derG; hDerB[j] = derB;
              hCenR[j] = cenR; hCenG[j] = cenG; hCenB[j] = cenB;
            }
          } else {
            hIzqR[hIdx] = izqR; hIzqG[hIdx] = izqG; hIzqB[hIdx] = izqB;
            hSupR[hIdx] = supR; hSupG[hIdx] = supG; hSupB[hIdx] = supB;
            hDerR[hIdx] = derR; hDerG[hIdx] = derG; hDerB[hIdx] = derB;
            hCenR[hIdx] = cenR; hCenG[hIdx] = cenG; hCenB[hIdx] = cenB;
            hIdx = (hIdx + 1) % 5;
          }

          izqR = median5(hIzqR[0], hIzqR[1], hIzqR[2], hIzqR[3], hIzqR[4]);
          izqG = median5(hIzqG[0], hIzqG[1], hIzqG[2], hIzqG[3], hIzqG[4]);
          izqB = median5(hIzqB[0], hIzqB[1], hIzqB[2], hIzqB[3], hIzqB[4]);

          supR = median5(hSupR[0], hSupR[1], hSupR[2], hSupR[3], hSupR[4]);
          supG = median5(hSupG[0], hSupG[1], hSupG[2], hSupG[3], hSupG[4]);
          supB = median5(hSupB[0], hSupB[1], hSupB[2], hSupB[3], hSupB[4]);

          derR = median5(hDerR[0], hDerR[1], hDerR[2], hDerR[3], hDerR[4]);
          derG = median5(hDerG[0], hDerG[1], hDerG[2], hDerG[3], hDerG[4]);
          derB = median5(hDerB[0], hDerB[1], hDerB[2], hDerB[3], hDerB[4]);

          cenR = median5(hCenR[0], hCenR[1], hCenR[2], hCenR[3], hCenR[4]);
          cenG = median5(hCenG[0], hCenG[1], hCenG[2], hCenG[3], hCenG[4]);
          cenB = median5(hCenB[0], hCenB[1], hCenB[2], hCenB[3], hCenB[4]);

          // Detección del estado real del hardware (Vídeo vs Estático vs Standby) ANTES de smoothRedPurity
          // para no aplastar la dispersión real de cámara en escenas cálidas/rojas de vídeo:
          int maxHead = std::max({izqR, izqG, izqB, supR, supG, supB});
          int maxOverall = std::max({maxHead, derR, derG, derB, cenR, cenG, cenB});
          // Si la cabeza de la tira (primeros 18 LEDs: IZQ + SUP) está completamente apagada (<= 6),
          // cualquier valor residual en la cola (DER/CEN) es ruido de 50Hz sin GND con la tira en Standby:
          if (maxHead <= 6) {
            derR = 0; derG = 0; derB = 0;
            cenR = 0; cenG = 0; cenB = 0;
            maxOverall = maxHead;
          }
          bool isBlack = (maxOverall <= 6 || (currentMode == "Standby" && maxHead <= 14));

          // Dispersión cromática y espacial:
          // 1. rawSpread: diferencia directa de brillo y color entre bordes (milestone da7c289).
          int maxR = std::max({izqR, supR, derR, cenR});
          int minR = std::min({izqR, supR, derR, cenR});
          int maxG = std::max({izqG, supG, derG, cenG});
          int minG = std::min({izqG, supG, derG, cenG});
          int maxB = std::max({izqB, supB, derB, cenB});
          int minB = std::min({izqB, supB, derB, cenB});
          int rawSpread = (maxR - minR) + (maxG - minG) + (maxB - minB);

          // 2. chromaSpread: proporción cromática normalizada a 255.
          int normR[4], normG[4], normB[4];
          int validZones = 0;
          int zR[4] = {izqR, supR, derR, cenR};
          int zG[4] = {izqG, supG, derG, cenG};
          int zB[4] = {izqB, supB, derB, cenB};
          for (int z = 0; z < 4; z++) {
            int m = std::max({zR[z], zG[z], zB[z]});
            if (m >= 15) {
              normR[validZones] = (zR[z] * 255) / m;
              normG[validZones] = (zG[z] * 255) / m;
              normB[validZones] = (zB[z] * 255) / m;
              validZones++;
            }
          }
          int chromaSpread = 0;
          if (validZones >= 2) {
            int maxNR = normR[0], minNR = normR[0];
            int maxNG = normG[0], minNG = normG[0];
            int maxNB = normB[0], minNB = normB[0];
            for (int z = 1; z < validZones; z++) {
              maxNR = std::max(maxNR, normR[z]); minNR = std::min(minNR, normR[z]);
              maxNG = std::max(maxNG, normG[z]); minNG = std::min(minNG, normG[z]);
              maxNB = std::max(maxNB, normB[z]); minNB = std::min(minNB, normB[z]);
            }
            chromaSpread = (maxNR - minNR) + (maxNG - minNG) + (maxNB - minNB);
          }

          int totalSpread = std::max(rawSpread, chromaSpread);

          static int prevRawIzqR = -1, prevRawIzqG = -1, prevRawIzqB = -1;
          static int prevRawSupR = -1, prevRawSupG = -1, prevRawSupB = -1;
          static int prevRawDerR = -1, prevRawDerG = -1, prevRawDerB = -1;
          static int prevRawCenR = -1, prevRawCenG = -1, prevRawCenB = -1;

          int deltaIzq = (prevRawIzqR < 0) ? 0 : (abs(izqR - prevRawIzqR) + abs(izqG - prevRawIzqG) + abs(izqB - prevRawIzqB));
          int deltaSup = (prevRawSupR < 0) ? 0 : (abs(supR - prevRawSupR) + abs(supG - prevRawSupG) + abs(supB - prevRawSupB));
          int deltaDer = (prevRawDerR < 0) ? 0 : (abs(derR - prevRawDerR) + abs(derG - prevRawDerG) + abs(derB - prevRawDerB));
          int deltaCen = (prevRawCenR < 0) ? 0 : (abs(cenR - prevRawCenR) + abs(cenG - prevRawCenG) + abs(cenB - prevRawCenB));

          // Supresión física de bit-slip de cola WS2811 (sin GND):
          // Los primeros 7 LEDs tras el pulso de reset (>60us, 0..210us) son IZQ (LEDs 1..7), seguidos de SUP (LEDs 8..18).
          // En modo Estático real, IZQ permanece congelado (deltaIzq <= 6) mientras la onda de 50Hz puede desplazar bits
          // en la cola (CEN/DER) o puntualmente en un borde intermedio.
          int dColorIS = abs(izqR - supR) + abs(izqG - supG) + abs(izqB - supB);
          int dCenToHead = abs(cenR - izqR) + abs(cenG - izqG) + abs(cenB - izqB);
          int dDerToHead = abs(derR - izqR) + abs(derG - izqG) + abs(derB - izqB);
          bool isHeadFrozenUniform = (!isBlack && prevRawIzqR >= 0 && dColorIS <= 16 && deltaIzq <= 6 && deltaSup <= 6);
          bool isIzqDerFrozenUniform = (!isBlack && prevRawIzqR >= 0 && dDerToHead <= 16 && deltaIzq <= 6 && deltaDer <= 6);
          if (isHeadFrozenUniform) {
            if (dCenToHead >= 20 || deltaCen >= 16) {
              cenR = izqR; cenG = izqG; cenB = izqB;
              deltaCen = deltaIzq;
            }
            if (dDerToHead >= 20 || deltaDer >= 16) {
              derR = izqR; derG = izqG; derB = izqB;
              deltaDer = deltaIzq;
            }
          } else if (isIzqDerFrozenUniform) {
            if (dColorIS >= 20 || deltaSup >= 16) {
              supR = izqR; supG = izqG; supB = izqB;
              deltaSup = deltaIzq;
              dColorIS = 0;
            }
            if (dCenToHead >= 20 || deltaCen >= 16) {
              cenR = izqR; cenG = izqG; cenB = izqB;
              deltaCen = deltaIzq;
            }
          }

          int headDelta = deltaIzq + deltaSup;
          int tempDelta = deltaIzq + deltaSup + deltaDer + deltaCen;

          // Recalcular rawSpread tras limpiar posibles glitches de cola:
          maxR = std::max({izqR, supR, derR, cenR});
          minR = std::min({izqR, supR, derR, cenR});
          maxG = std::max({izqG, supG, derG, cenG});
          minG = std::min({izqG, supG, derG, cenG});
          maxB = std::max({izqB, supB, derB, cenB});
          minB = std::min({izqB, supB, derB, cenB});
          rawSpread = (maxR - minR) + (maxG - minG) + (maxB - minB);

          // Detección y neutralización de micro-glitches de bus y micro-cortes de 50Hz sin GND:
          static int consecutiveBlackFrames = 0;
          if (isBlack) {
            consecutiveBlackFrames++;
          } else {
            consecutiveBlackFrames = 0;
          }

          // Si veníamos con señal encendida y cae a 0 durante solo 1..2 fotogramas (<90ms),
          // es un micro-corte por oscilación de masa flotante, NO un apagado real.
          bool isTransientBlackDrop = (isBlack && consecutiveBlackFrames <= 2 && prevRawIzqR >= 0);

          if (!isBlack) {
            prevRawIzqR = izqR; prevRawIzqG = izqG; prevRawIzqB = izqB;
            prevRawSupR = supR; prevRawSupG = supG; prevRawSupB = supB;
            prevRawDerR = derR; prevRawDerG = derG; prevRawDerB = derB;
            prevRawCenR = cenR; prevRawCenG = cenG; prevRawCenB = cenB;
          }

          // Salida de Standby por señal activa sostenida en la cabeza de la tira (IZQ/SUP):
          static int consecutiveAwakeFrames = 0;
          if (isBlack) {
            consecutiveAwakeFrames = 0;
          } else {
            consecutiveAwakeFrames++;
          }
          consecutiveAwakeFrames = std::min(consecutiveAwakeFrames, 100);

          // Integrador Leaky-Bucket compatible tanto con Vídeo Multizona (Part) como Vídeo Pantalla Completa (full_screen: true):
          static uint32_t lastVideoActivityTime = 0;
          static int staticRefR = -1, staticRefG = -1, staticRefB = -1;
          static int staticAnchorR = -1, staticAnchorG = -1, staticAnchorB = -1;
          static int uniformShiftFrames = 0;
          static int uniformColorChanges = 0;
          static uint32_t lastUniformChangeTime = 0;
          int spatialContrast = 0;
          bool isPerimeterUniform = false;

          if (isTransientBlackDrop) {
            // Ignorar micro-corte de 1..2 frames sin destruir sF ni vF
          } else if (isBlack) {
            if (consecutiveVideoFrames > 0) consecutiveVideoFrames--;
            if (consecutiveStaticFrames > 0) consecutiveStaticFrames--;
            uniformShiftFrames = 0;
          } else {
            // Contraste espacial perimetral directo:
            int dColorLR = abs(izqR - derR) + abs(izqG - derG) + abs(izqB - derB);
            int dColorTC = abs(supR - cenR) + abs(supG - cenG) + abs(supB - cenB);
            spatialContrast = std::max({dColorIS, dColorLR, dColorTC});

            // 1. hasSpatialDiversity: Contraste multizona real verificado en la cabeza de la tira (IZQ/SUP/DER).
            bool hasSpatialDiversity = (dColorIS >= 28 || dColorLR >= 32 || rawSpread >= 42);

            // 2. isPerimeterUniform: Todos los bordes tienen el mismo color.
            isPerimeterUniform = (dColorIS <= 16 && dColorLR <= 20 && rawSpread <= 28);

            // 3. isCoherentFullStripMotion: Las 4 zonas cambian al unísono manteniendo el mismo color en toda la tira
            //    (ej. modo Vídeo full_screen: true donde contrast=0..12 y dt >= 12 en toda la tira a la vez).
            //    El ruido de 50Hz sin GND jamás desplaza las 4 zonas al mismo RGB simultáneamente.
            bool isCoherentFullStripMotion = (spatialContrast <= 12 && rawSpread <= 16 &&
                                              tempDelta >= 12 && deltaIzq >= 2 && deltaSup >= 2 && deltaDer >= 2);

            // 4. Referencia de color para medir deriva cromática/brillo en planos suaves de Vídeo full_screen: true:
            if (staticRefR < 0 || consecutiveStaticFrames == 0) {
              staticRefR = izqR; staticRefG = izqG; staticRefB = izqB;
            }
            int dFromStaticRef = abs(izqR - staticRefR) + abs(izqG - staticRefG) + abs(izqB - staticRefB);

            // 5. hasHeadMotion: Cambio dinámico real en los primeros 18 LEDs (IZQ + SUP).
            bool hasHeadMotion = (headDelta >= 22 || (deltaIzq >= 12 && deltaSup >= 12));

            // 6. isVideoActivity: Actividad de vídeo tanto multizona como pantalla completa (full_screen: true).
            //    En full_screen: true la TV cambia de color/escena continuamente con contrast=0 pero dt enorme (dt=50..450).
            bool isVideoActivity = (hasSpatialDiversity || hasHeadMotion || isCoherentFullStripMotion);

            // 7. isTrulyStatic: Perímetro uniforme, congelado frame a frame y sin deriva respecto a staticRef:
            bool isTrulyStatic = (dColorIS <= 14 && dColorLR <= 18 && headDelta <= 8 && tempDelta <= 12 && dFromStaticRef <= 12);

            if (hasSpatialDiversity || isCoherentFullStripMotion) {
              consecutiveStrongVideoFrames++;
            } else if (isTrulyStatic || (isPerimeterUniform && tempDelta <= 6)) {
              consecutiveStrongVideoFrames = std::max(0, consecutiveStrongVideoFrames - 3);
            }
            consecutiveStrongVideoFrames = std::min(consecutiveStrongVideoFrames, 100);

            if (isVideoActivity) {
              consecutiveVideoFrames++;
              if (consecutiveVideoFrames >= 8) {
                lastVideoActivityTime = now;
              }
            } else if (isTrulyStatic || (isPerimeterUniform && tempDelta <= 6)) {
              consecutiveVideoFrames = std::max(0, consecutiveVideoFrames - 3);
            }

            if (isCoherentFullStripMotion || (isPerimeterUniform && dFromStaticRef >= 14) ||
                (hasSpatialDiversity && consecutiveStrongVideoFrames >= 4) ||
                (isVideoActivity && consecutiveVideoFrames >= 8)) {
              // En modo Vídeo (tanto multizona como full_screen: true), cualquier corte de plano (dt>=12 con contrast<=12)
              // o deriva de color/brillo de cámara (>=14 respecto a staticRef) reinicia sF a 0 inmediatamente:
              consecutiveStaticFrames = 0;
              staticRefR = izqR; staticRefG = izqG; staticRefB = izqB;
            } else if (isTrulyStatic) {
              consecutiveStaticFrames++;
              if (consecutiveStaticFrames >= 12) {
                consecutiveVideoFrames = 0;
                consecutiveStrongVideoFrames = 0;
              }
            } else if (isVideoActivity) {
              consecutiveStaticFrames = std::max(0, consecutiveStaticFrames - 3);
            }
          }

          // Evitar desbordamiento de contadores:
          consecutiveVideoFrames = std::min(consecutiveVideoFrames, 120);
          consecutiveStaticFrames = std::min(consecutiveStaticFrames, 600);
          consecutiveBlackFrames = std::min(consecutiveBlackFrames, 150);

          std::string targetCandidate = currentMode;

          if (currentMode == "Standby") {
            // Salida de Standby al detectar luz/señal continua en la cabeza de la tira (>25 frames ~1.0s):
            if (!isBlack && consecutiveAwakeFrames >= 25) {
              if (consecutiveStrongVideoFrames >= 12 || consecutiveVideoFrames >= 16) {
                targetCandidate = "Vídeo";
              } else if (isPerimeterUniform && consecutiveStaticFrames >= 15) {
                targetCandidate = "Estático";
              } else {
                targetCandidate = previousActiveMode;
              }
            }
          } else if (currentMode == "Estático") {
            // Estando en Estático:
            if (consecutiveBlackFrames >= 100) {
              // Pantalla/tira apagada en negro durante ~4.0s -> Standby
              targetCandidate = "Standby";
            } else if (consecutiveStrongVideoFrames >= 30 || consecutiveVideoFrames >= 35) {
              // Conmuta a Vídeo ante ~1.2s..1.4s de actividad de vídeo sostenida.
              // En modo Vídeo full_screen: true, las escenas cambian continuamente con dt>50 alcanzando el umbral.
              // Cambiar de color estático una vez en la app Govee dura solo ~0.3s y decae a 0 de inmediato.
              targetCandidate = "Vídeo";
            }
          } else if (currentMode == "Vídeo") {
            // Estando en Vídeo:
            if (consecutiveBlackFrames >= 100) {
              // ~4.0s de negro absoluto sostenido -> Standby
              targetCandidate = "Standby";
            } else if (consecutiveStaticFrames >= 150) {
              // Transición a Estático: ~6.0s (150 frames) de señal perimetral uniforme y congelada.
              // Evita caer a Estático en planos tranquilos de 3..5s durante una película/vídeo,
              // y entra en Estático de forma continua a los 6s sin reseteos gracias a isHeadFrozenUniform.
              targetCandidate = "Estático";
            }
          }

          if (targetCandidate != currentMode || id(govee_hardware_state).state != currentMode) {
            if (targetCandidate != currentMode) {
              ESP_LOGW("mode", "CAMBIO DE ESTADO: %s -> %s (contrast=%d, dt=%d, vF=%d, sF=%d, bF=%d)",
                       currentMode.c_str(), targetCandidate.c_str(), spatialContrast, tempDelta,
                       consecutiveVideoFrames, consecutiveStaticFrames, consecutiveBlackFrames);
              currentMode = targetCandidate;
              currentSignalActive = (currentMode != "Standby");
              if (currentMode != "Standby") {
                previousActiveMode = currentMode;
              }
              consecutiveVideoFrames = 0;
              consecutiveStrongVideoFrames = 0;
              consecutiveStaticFrames = 0;
              consecutiveBlackFrames = 0;
              uniformShiftFrames = 0;
              uniformColorChanges = 0;
              staticRefR = izqR; staticRefG = izqG; staticRefB = izqB;
              staticAnchorR = izqR; staticAnchorG = izqG; staticAnchorB = izqB;
            }
            id(govee_hardware_state).publish_state(currentMode);
            id(govee_signal_active).publish_state(currentSignalActive);
          }

          static uint32_t lastDiagPrint = 0;
          if (now - lastDiagPrint >= 2000) {
            ESP_LOGI("mode", "Govee Hardware: %s (contrast=%d, dt=%d, vF=%d, sF=%d, bF=%d)",
                     currentMode.c_str(), spatialContrast, tempDelta,
                     consecutiveVideoFrames, consecutiveStaticFrames, consecutiveBlackFrames);
            lastDiagPrint = now;
          }

          // Si el interruptor del puente está APAGADO en Home Assistant,
          // no enviamos nada a las bombillas secundarias (el hardware queda monitorizado sin alterar el filtro de mediana).
          if (!id(modo_ambilight).state) {
            fIzqR = -1; fSupR = -1; fCenR = -1; fDerR = -1;
            pIzqR = -1; pSupR = -1; pCenR = -1; pDerR = -1;
            if (millis() - tDiag >= 3000) {
              ESP_LOGI("sniffer", "PAUSADO: Modo Ambilight está APAGADO en Home Assistant.");
              tDiag = millis();
            }
            return;
          }

          // En cable único sin GND, si hay micro-corte transitorio (<160ms) o si estamos en Estático
          // y pasa una ráfaga corrupta no uniforme, no ensuciamos las bombillas del salón:
          if (isTransientBlackDrop || (currentMode == "Estático" && !isPerimeterUniform)) {
            return;
          }

          // Compresión cromática suave para escenas dominantemente rojas (aplicada solo a la salida de bombillas):
          auto smoothRedPurity = [](int &r, int &g, int &b) {
            if (r >= 90 && b < 50 && g < 80 && (r > g * 2)) {
              float rg = (float)g / 80.0f;
              g = (int)(g * rg * rg);
              if (b < 35) {
                float rb = (float)b / 35.0f;
                b = (int)(b * rb * rb);
              }
            }
          };

          smoothRedPurity(izqR, izqG, izqB);
          smoothRedPurity(supR, supG, supB);
          smoothRedPurity(derR, derG, derB);
          smoothRedPurity(cenR, cenG, cenB);

          // Suavizado temporal IIR adaptativo:
          auto smoothAdaptive = [](int currentF, int newTarget) -> int {
            if (currentF < 0) return newTarget;
            int diff = abs(newTarget - currentF);
            if (diff < 28) {
              return (currentF * 7 + newTarget + 4) / 8;
            } else {
              return (currentF * 3 + newTarget + 2) / 4;
            }
          };

          // Detección de zonas en negro en tiempo real (supera el suelo de low_brightness de 20s de Govee H6199):
          bool blackIzq = (std::max({izqR, izqG, izqB}) <= 18 && (izqR + izqG + izqB) <= 36);
          bool blackDer = (std::max({derR, derG, derB}) <= 18 && (derR + derG + derB) <= 36);
          bool blackCen = (std::max({cenR, cenG, cenB}) <= 18 && (cenR + cenG + cenB) <= 36);
          bool blackSup = (std::max({supR, supG, supB}) <= 18 && (supR + supG + supB) <= 36);

          bool prevBlackIzq = (pIzqR >= 0 && pIzqR <= 4 && pIzqG <= 4 && pIzqB <= 4);
          bool prevBlackDer = (pDerR >= 0 && pDerR <= 4 && pDerG <= 4 && pDerB <= 4);
          bool prevBlackCen = (pCenR >= 0 && pCenR <= 4 && pCenG <= 4 && pCenB <= 4);
          bool prevBlackSup = (pSupR >= 0 && pSupR <= 4 && pSupG <= 4 && pSupB <= 4);

          if (id(modo_blackout).state) {
            if (blackIzq) { fIzqR = 0; fIzqG = 0; fIzqB = 0; }
            else {
              fIzqR = prevBlackIzq ? izqR : smoothAdaptive(fIzqR, izqR);
              fIzqG = prevBlackIzq ? izqG : smoothAdaptive(fIzqG, izqG);
              fIzqB = prevBlackIzq ? izqB : smoothAdaptive(fIzqB, izqB);
            }

            if (blackDer) { fDerR = 0; fDerG = 0; fDerB = 0; }
            else {
              fDerR = prevBlackDer ? derR : smoothAdaptive(fDerR, derR);
              fDerG = prevBlackDer ? derG : smoothAdaptive(fDerG, derG);
              fDerB = prevBlackDer ? derB : smoothAdaptive(fDerB, derB);
            }

            if (blackCen) { fCenR = 0; fCenG = 0; fCenB = 0; }
            else {
              fCenR = prevBlackCen ? cenR : smoothAdaptive(fCenR, cenR);
              fCenG = prevBlackCen ? cenG : smoothAdaptive(fCenG, cenG);
              fCenB = prevBlackCen ? cenB : smoothAdaptive(fCenB, cenB);
            }

            if (blackSup) { fSupR = 0; fSupG = 0; fSupB = 0; }
            else {
              fSupR = prevBlackSup ? supR : smoothAdaptive(fSupR, supR);
              fSupG = prevBlackSup ? supG : smoothAdaptive(fSupG, supG);
              fSupB = prevBlackSup ? supB : smoothAdaptive(fSupB, supB);
            }
          } else {
            if (fIzqR < 0) {
              fIzqR = izqR; fIzqG = izqG; fIzqB = izqB;
              fSupR = supR; fSupG = supG; fSupB = supB;
              fCenR = cenR; fCenG = cenG; fCenB = cenB;
              fDerR = derR; fDerG = derG; fDerB = derB;
            } else {
              fIzqR = smoothAdaptive(fIzqR, izqR);
              fIzqG = smoothAdaptive(fIzqG, izqG);
              fIzqB = smoothAdaptive(fIzqB, izqB);

              fSupR = smoothAdaptive(fSupR, supR);
              fSupG = smoothAdaptive(fSupG, supG);
              fSupB = smoothAdaptive(fSupB, supB);

              fCenR = smoothAdaptive(fCenR, cenR);
              fCenG = smoothAdaptive(fCenG, cenG);
              fCenB = smoothAdaptive(fCenB, cenB);

              fDerR = smoothAdaptive(fDerR, derR);
              fDerG = smoothAdaptive(fDerG, derG);
              fDerB = smoothAdaptive(fDerB, derB);
            }
          }

          static uint32_t lastSendIzq = 0;
          static uint32_t lastSendDer = 0;
          static uint32_t lastSendCen = 0;
          static uint32_t lastSendSup = 0;
          static uint32_t lastForceSend = 0;

          now = millis();
          bool force = (now - lastForceSend > 15000);

          float trans = id(velocidad_transicion).state;
          uint32_t minInterval = 100;
          if (trans > 0.01f) {
            minInterval = (uint32_t)(trans * 1000.0f) + 40;
            if (minInterval < 100) minInterval = 100;
          }

          bool sentAny = false;

          // Eventos de apagado en negro (Blackout en tiempo real, trans=0.0s al apagar):
          bool isBlackTarget_izq = (fIzqR <= 4 && fIzqG <= 4 && fIzqB <= 4);
          bool wasBlack_izq = (pIzqR >= 0 && pIzqR <= 4 && pIzqG <= 4 && pIzqB <= 4);
          bool blackoutEvent_izq = (id(modo_blackout).state && (isBlackTarget_izq != wasBlack_izq));

          int dR_izq = abs(fIzqR - pIzqR);
          int dG_izq = abs(fIzqG - pIzqG);
          int dB_izq = abs(fIzqB - pIzqB);
          bool chgIzq = (dR_izq >= 18 || dG_izq >= 18 || dB_izq >= 18 || (dR_izq + dG_izq + dB_izq >= 28) || blackoutEvent_izq);
          if ((chgIzq || (force && (dR_izq >= 4 || dG_izq >= 4 || dB_izq >= 4))) &&
              (now - lastSendIzq >= minInterval || (force && chgIzq) || blackoutEvent_izq)) {
            id(enviar_color_ha)->execute("light.comedor_luces_izquierda", fIzqR, fIzqG, fIzqB, (id(modo_blackout).state && isBlackTarget_izq) ? 0.0f : trans);
            pIzqR = fIzqR; pIzqG = fIzqG; pIzqB = fIzqB;
            lastSendIzq = now;
            sentAny = true;
          }

          bool isBlackTarget_der = (fDerR <= 4 && fDerG <= 4 && fDerB <= 4);
          bool wasBlack_der = (pDerR >= 0 && pDerR <= 4 && pDerG <= 4 && pDerB <= 4);
          bool blackoutEvent_der = (id(modo_blackout).state && (isBlackTarget_der != wasBlack_der));

          int dR_der = abs(fDerR - pDerR);
          int dG_der = abs(fDerG - pDerG);
          int dB_der = abs(fDerB - pDerB);
          bool chgDer = (dR_der >= 18 || dG_der >= 18 || dB_der >= 18 || (dR_der + dG_der + dB_der >= 28) || blackoutEvent_der);
          if ((chgDer || (force && (dR_der >= 4 || dG_der >= 4 || dB_der >= 4))) &&
              (now - lastSendDer >= minInterval || (force && chgDer) || blackoutEvent_der)) {
            id(enviar_color_ha)->execute("light.comedor_luces_derecha", fDerR, fDerG, fDerB, (id(modo_blackout).state && isBlackTarget_der) ? 0.0f : trans);
            pDerR = fDerR; pDerG = fDerG; pDerB = fDerB;
            lastSendDer = now;
            sentAny = true;
          }

          bool isBlackTarget_cen = (fCenR <= 4 && fCenG <= 4 && fCenB <= 4);
          bool wasBlack_cen = (pCenR >= 0 && pCenR <= 4 && pCenG <= 4 && pCenB <= 4);
          bool blackoutEvent_cen = (id(modo_blackout).state && (isBlackTarget_cen != wasBlack_cen));

          int dR_cen = abs(fCenR - pCenR);
          int dG_cen = abs(fCenG - pCenG);
          int dB_cen = abs(fCenB - pCenB);
          bool chgCen = (dR_cen >= 18 || dG_cen >= 18 || dB_cen >= 18 || (dR_cen + dG_cen + dB_cen >= 28) || blackoutEvent_cen);
          if ((chgCen || (force && (dR_cen >= 4 || dG_cen >= 4 || dB_cen >= 4))) &&
              (now - lastSendCen >= minInterval || (force && chgCen) || blackoutEvent_cen)) {
            id(enviar_color_ha)->execute("light.comedor_luces_centro", fCenR, fCenG, fCenB, (id(modo_blackout).state && isBlackTarget_cen) ? 0.0f : trans);
            pCenR = fCenR; pCenG = fCenG; pCenB = fCenB;
            lastSendCen = now;
            sentAny = true;
          }

          if (id(activar_techo).state) {
            bool isBlackTarget_sup = (fSupR <= 4 && fSupG <= 4 && fSupB <= 4);
            bool wasBlack_sup = (pSupR >= 0 && pSupR <= 4 && pSupG <= 4 && pSupB <= 4);
            bool blackoutEvent_sup = (id(modo_blackout).state && (isBlackTarget_sup != wasBlack_sup));

            int dR_sup = abs(fSupR - pSupR);
            int dG_sup = abs(fSupG - pSupG);
            int dB_sup = abs(fSupB - pSupB);
            bool chgSup = (dR_sup >= 18 || dG_sup >= 18 || dB_sup >= 18 || (dR_sup + dG_sup + dB_sup >= 28) || blackoutEvent_sup);
            if ((chgSup || (force && (dR_sup >= 4 || dG_sup >= 4 || dB_sup >= 4))) &&
                (now - lastSendSup >= minInterval || (force && chgSup) || blackoutEvent_sup)) {
              id(enviar_color_ha)->execute("light.comedor_luces_techo", fSupR, fSupG, fSupB, (id(modo_blackout).state && isBlackTarget_sup) ? 0.0f : trans);
              pSupR = fSupR; pSupG = fSupG; pSupB = fSupB;
              lastSendSup = now;
              sentAny = true;
            }
          }
          if (force) lastForceSend = now;

          if (sentAny) {
            uint32_t elapsed = millis() - tLoopStart;
            float measuredLat = 65.0f + (float)elapsed + (trans * 1000.0f);
            id(lat_sum) += measuredLat;
            id(lat_count)++;
          }

          static uint32_t tLog = 0;
          if (millis() - tLog >= 1000) {
            ESP_LOGI("ambilight", "LEDs: %d | IZQ(R:%d,G:%d,B:%d) CEN(R:%d,G:%d,B:%d) DER(R:%d,G:%d,B:%d) | Trans: %.2fs (Lat: %.0fms)",
                     ledsLeidos,
                     fIzqR, fIzqG, fIzqB, fCenR, fCenG, fCenB, fDerR, fDerG, fDerB,
                     trans, 65.0f + (trans * 1000.0f));
            tLog = millis();
          }

# Board: ESP32-C3 DevKitM-1 (Espressif RISC-V 160MHz)
esphome:
  name: esp32-ambiligth
  friendly_name: Ambilight Govee Bridge
  includes:
    - govee_sniffer.h
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - homeassistant.service:
          service: homeassistant.reload_all
      - homeassistant.service:
          service: input_boolean.reload
      - homeassistant.service:
          service: automation.reload
      - homeassistant.service:
          service: script.reload
      - lambda: |-
          float val = id(velocidad_transicion).state;
          float lat = 65.0f + (val * 1000.0f);
          id(latencia_estimada).publish_state(lat);
          id(latencia_media_registrada).publish_state(lat);

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: "87R9C1MCPvg8ijQB5aM+enPk26Hbs51ah0OtsMBNv6w="

ota:
  - platform: esphome

wifi:
  ssid: "PAGAtuWIFI"
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: 192.168.1.192
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1

button:
  - platform: restart
    name: "Restart ESP32"
    id: reiniciar_esp32
    icon: "mdi:restart"

  - platform: template
    name: "View Live Logs"
    id: btn_abrir_registros
    icon: "mdi:console-network"
    on_press:
      - homeassistant.service:
          service: script.ver_pantalla_de_registros

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode:
        input: true
        pulldown: true
    id: pin_datos
    internal: true

sensor:
  - platform: template
    name: "Estimated Latency"
    id: latencia_estimada
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    icon: "mdi:timer-outline"
    state_class: measurement

  - platform: template
    name: "Average Latency (20s)"
    id: latencia_media_registrada
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    icon: "mdi:chart-timeline-variant"
    state_class: measurement

globals:
  - id: test_en_curso
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: lat_sum
    type: float
    initial_value: '0.0'
  - id: lat_count
    type: uint32_t
    initial_value: '0'

switch:
  - platform: template
    name: "1. Ambilight Mode"
    id: modo_ambilight
    icon: "mdi:television-ambient-light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "3. Ceiling Light"
    id: activar_techo
    icon: "mdi:ceiling-light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Rotation: Invert Direction"
    id: invertir_sentido
    icon: "mdi:rotate-left-variant"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: template
    name: "2. Transition Speed"
    id: velocidad_transicion
    unit_of_measurement: "s"
    icon: "mdi:transition"
    min_value: 0.0
    max_value: 1.5
    step: 0.05
    initial_value: 0.0
    mode: slider
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          float val = id(velocidad_transicion).state;
          float lat = 65.0f + (val * 1000.0f);
          id(latencia_estimada).publish_state(lat);

  - platform: template
    name: "Edge 1 - Left (LEDs)"
    id: num_leds_izq
    icon: "mdi:arrow-left-bold-box-outline"
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 2 - Top (LEDs)"
    id: num_leds_sup
    icon: "mdi:arrow-up-bold-box-outline"
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 3 - Right (LEDs)"
    id: num_leds_der
    icon: "mdi:arrow-right-bold-box-outline"
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 4 - Bottom (LEDs)"
    id: num_leds_inf
    icon: "mdi:arrow-down-bold-box-outline"
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Rotation: 360° Angle"
    id: rotacion_offset
    unit_of_measurement: "°"
    icon: "mdi:rotate-360"
    min_value: -180
    max_value: 180
    step: 1
    initial_value: 0
    mode: slider
    optimistic: true
    restore_value: true

script:
  - id: enviar_color_ha
    mode: parallel
    max_runs: 10
    parameters:
      entidad: string
      r: int
      g: int
      b: int
      trans: float
    then:
      - lambda: |-
          ESP_LOGI("ha_send", "EVENT -> %s: R=%d G=%d B=%d (trans=%.2fs)", entidad.c_str(), r, g, b, trans);
      - homeassistant.event:
          event: esphome.ambilight_color
          data:
            entity_id: !lambda "return entidad;"
            r: !lambda "return std::to_string(r);"
            g: !lambda "return std::to_string(g);"
            b: !lambda "return std::to_string(b);"
            transition: !lambda 'return str_sprintf("%.2f", trans);'

interval:
  - interval: 20s
    then:
      - lambda: |-
          if (id(lat_count) > 0) {
            float avg = id(lat_sum) / (float)id(lat_count);
            id(latencia_media_registrada).publish_state(roundf(avg));
          } else {
            float base = 65.0f + (id(velocidad_transicion).state * 1000.0f);
            id(latencia_media_registrada).publish_state(roundf(base));
          }
          id(lat_sum) = 0.0f;
          id(lat_count) = 0;

  - interval: 40ms
    then:
      - lambda: |-
          static int fIzqR = -1, fIzqG = -1, fIzqB = -1;
          static int fSupR = -1, fSupG = -1, fSupB = -1;
          static int fCenR = -1, fCenG = -1, fCenB = -1;
          static int fDerR = -1, fDerG = -1, fDerB = -1;

          static int pIzqR = -1, pIzqG = -1, pIzqB = -1;
          static int pSupR = -1, pSupG = -1, pSupB = -1;
          static int pCenR = -1, pCenG = -1, pCenB = -1;
          static int pDerR = -1, pDerG = -1, pDerB = -1;

          static uint32_t tDiag = 0;
          if (id(test_en_curso) || !id(modo_ambilight).state) {
            fIzqR = -1; fSupR = -1; fCenR = -1; fDerR = -1;
            pIzqR = -1; pSupR = -1; pCenR = -1; pDerR = -1;
            if (millis() - tDiag >= 3000) {
              ESP_LOGI("sniffer", "PAUSADO: Modo Ambilight está APAGADO en Home Assistant.");
              tDiag = millis();
            }
            return;
          }

          uint32_t tLoopStart = millis();

          const int MAX_LEDS = 37;
          uint8_t ledData[MAX_LEDS * 3] = {0};

          int ledsLeidos = capture_govee_frame(ledData, MAX_LEDS);

          if (ledsLeidos < 37) {
            if (millis() - tDiag >= 2000) {
              ESP_LOGW("sniffer", "Trama incompleta o sin señal: %d/37 leds (GPIO3=%d).", ledsLeidos, id(pin_datos).state);
              tDiag = millis();
            }
            return;
          }

          float rotDeg = id(rotacion_offset).state;
          int offset = (int)roundf(rotDeg * 36.0f / 360.0f);
          bool invert = id(invertir_sentido).state;
          int nIzq = (int)id(num_leds_izq).state;
          int nSup = (int)id(num_leds_sup).state;
          int nDer = (int)id(num_leds_der).state;
          int nInf = (int)id(num_leds_inf).state;

          const int TOTAL_LEDS_LOOP = 36;

          auto getLedIndex = [&](int virtualPos) -> int {
            int pos = virtualPos % TOTAL_LEDS_LOOP;
            if (invert) {
              pos = (TOTAL_LEDS_LOOP * 10 + offset - pos) % TOTAL_LEDS_LOOP;
            } else {
              pos = (TOTAL_LEDS_LOOP * 10 + pos + offset) % TOTAL_LEDS_LOOP;
            }
            return 1 + pos;
          };

          // WS2811 GRB: Byte 0 = G, Byte 1 = R, Byte 2 = B
          // A. Zona Izquierda
          long sR_izq = 0, sG_izq = 0, sB_izq = 0;
          for (int i = 0; i < nIzq; i++) {
            int k = getLedIndex(i);
            sG_izq += ledData[k * 3 + 0];
            sR_izq += ledData[k * 3 + 1];
            sB_izq += ledData[k * 3 + 2];
          }
          int izqR = sR_izq / nIzq;
          int izqG = sG_izq / nIzq;
          int izqB = sB_izq / nIzq;

          // B. Zona Techo (Borde Superior)
          int startSupVirt = nIzq;
          long sR_sup = 0, sG_sup = 0, sB_sup = 0;
          for (int i = startSupVirt; i < startSupVirt + nSup; i++) {
            int k = getLedIndex(i);
            sG_sup += ledData[k * 3 + 0];
            sR_sup += ledData[k * 3 + 1];
            sB_sup += ledData[k * 3 + 2];
          }
          int supR = (nSup > 0) ? (sR_sup / nSup) : 0;
          int supG = (nSup > 0) ? (sG_sup / nSup) : 0;
          int supB = (nSup > 0) ? (sB_sup / nSup) : 0;

          // C. Zona Derecha
          int startDerVirt = nIzq + nSup;
          long sR_der = 0, sG_der = 0, sB_der = 0;
          for (int i = startDerVirt; i < startDerVirt + nDer; i++) {
            int k = getLedIndex(i);
            sG_der += ledData[k * 3 + 0];
            sR_der += ledData[k * 3 + 1];
            sB_der += ledData[k * 3 + 2];
          }
          int derR = sR_der / nDer;
          int derG = sG_der / nDer;
          int derB = sB_der / nDer;

          // D. Zona Centro (Borde Inferior / Mesa)
          int startInfVirt = startDerVirt + nDer;
          if (nInf < 1) nInf = 1;

          long sR_cen = 0, sG_cen = 0, sB_cen = 0;
          for (int i = startInfVirt; i < startInfVirt + nInf; i++) {
            int k = getLedIndex(i);
            sG_cen += ledData[k * 3 + 0];
            sR_cen += ledData[k * 3 + 1];
            sB_cen += ledData[k * 3 + 2];
          }
          int cenR = sR_cen / nInf;
          int cenG = sG_cen / nInf;
          int cenB = sB_cen / nInf;

          fIzqR = izqR; fIzqG = izqG; fIzqB = izqB;
          fSupR = supR; fSupG = supG; fSupB = supB;
          fCenR = cenR; fCenG = cenG; fCenB = cenB;
          fDerR = derR; fDerG = derG; fDerB = derB;

          static uint32_t lastSendIzq = 0;
          static uint32_t lastSendDer = 0;
          static uint32_t lastSendCen = 0;
          static uint32_t lastSendSup = 0;
          static uint32_t lastForceSend = 0;

          uint32_t now = millis();
          bool force = (now - lastForceSend > 2500);

          float trans = id(velocidad_transicion).state;
          uint32_t minInterval = 60;
          if (trans > 0.01f) {
            minInterval = (uint32_t)(trans * 750.0f);
            if (minInterval < 60) minInterval = 60;
          }

          bool sentAny = false;

          // Disparo ante cambios respetando la cadencia de transicion
          if ((force || abs(fIzqR - pIzqR) >= 7 || abs(fIzqG - pIzqG) >= 7 || abs(fIzqB - pIzqB) >= 7) && (now - lastSendIzq >= minInterval || force)) {
            id(enviar_color_ha)->execute("light.comedor_luces_izquierda", fIzqR, fIzqG, fIzqB, trans);
            pIzqR = fIzqR; pIzqG = fIzqG; pIzqB = fIzqB;
            lastSendIzq = now;
            sentAny = true;
          }
          if ((force || abs(fDerR - pDerR) >= 7 || abs(fDerG - pDerG) >= 7 || abs(fDerB - pDerB) >= 7) && (now - lastSendDer >= minInterval || force)) {
            id(enviar_color_ha)->execute("light.comedor_luces_derecha", fDerR, fDerG, fDerB, trans);
            pDerR = fDerR; pDerG = fDerG; pDerB = fDerB;
            lastSendDer = now;
            sentAny = true;
          }
          if ((force || abs(fCenR - pCenR) >= 7 || abs(fCenG - pCenG) >= 7 || abs(fCenB - pCenB) >= 7) && (now - lastSendCen >= minInterval || force)) {
            id(enviar_color_ha)->execute("light.comedor_luces_centro", fCenR, fCenG, fCenB, trans);
            pCenR = fCenR; pCenG = fCenG; pCenB = fCenB;
            lastSendCen = now;
            sentAny = true;
          }

          if (id(activar_techo).state) {
            if ((force || abs(fSupR - pSupR) >= 7 || abs(fSupG - pSupG) >= 7 || abs(fSupB - pSupB) >= 7) && (now - lastSendSup >= minInterval || force)) {
              id(enviar_color_ha)->execute("light.comedor_luces_techo", fSupR, fSupG, fSupB, trans);
              pSupR = fSupR; pSupG = fSupG; pSupB = fSupB;
              lastSendSup = now;
              sentAny = true;
            }
          }
          if (force) lastForceSend = now;

          if (sentAny) {
            uint32_t elapsed = millis() - tLoopStart;
            float measuredLat = 65.0f + (float)elapsed + (trans * 1000.0f);
            id(lat_sum) += measuredLat;
            id(lat_count)++;
          }

          static uint32_t tLog = 0;
          if (millis() - tLog >= 1000) {
            ESP_LOGI("ambilight", "LEDs: %d | IZQ(R:%d,G:%d,B:%d) CEN(R:%d,G:%d,B:%d) DER(R:%d,G:%d,B:%d) | Trans: %.2fs (Lat: %.0fms)",
                     ledsLeidos,
                     fIzqR, fIzqG, fIzqB, fCenR, fCenG, fCenB, fDerR, fDerG, fDerB,
                     trans, 65.0f + (trans * 1000.0f));
            tLog = millis();
          }

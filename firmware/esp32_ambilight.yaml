# Board: ESP32-C3 DevKitM-1 (Espressif)
esphome:
  name: esp32-ambiligth
  friendly_name: Ambilight Govee Bridge
  includes:
    - govee_sniffer.h

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: "87R9C1MCPvg8ijQB5aM+enPk26Hbs51ah0OtsMBNv6w="

ota:
  - platform: esphome

wifi:
  ssid: "PAGAtuWIFI"
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: 192.168.1.192
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode:
        input: true
    id: pin_datos
    internal: true

globals:
  - id: test_en_curso
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: template
    name: "Ambilight Mode"
    id: modo_ambilight
    icon: "mdi:television-ambient-light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: |-
          id(modo_luces).publish_state("Ambilight");
    on_turn_off:
      - lambda: |-
          id(modo_luces).publish_state("Custom");
      - homeassistant.service:
          service: homeassistant.turn_off
          data:
            entity_id: "light.comedor_luces_izquierda"
      - homeassistant.service:
          service: homeassistant.turn_off
          data:
            entity_id: "light.comedor_luces_centro"
      - homeassistant.service:
          service: homeassistant.turn_off
          data:
            entity_id: "light.comedor_luces_derecha"
      - if:
          condition:
            lambda: 'return id(activar_techo).state;'
          then:
            - homeassistant.service:
                service: homeassistant.turn_off
                data:
                  entity_id: "light.comedor_luces_techo"

  - platform: template
    name: "Invert Rotation Direction"
    id: invertir_sentido
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Enable Ceiling Light (Top Edge)"
    id: activar_techo
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

select:
  - platform: template
    name: "Mode Selector"
    id: modo_luces
    icon: "mdi:tune-variant"
    options:
      - "Ambilight"
      - "Custom"
    initial_option: "Ambilight"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          if (x == "Ambilight") {
            id(modo_ambilight).turn_on();
          } else {
            id(modo_ambilight).turn_off();
          }

number:
  # Explicit sliders for granular control
  - platform: template
    name: "360° Rotation"
    id: rotacion_offset
    unit_of_measurement: "°"
    icon: "mdi:rotate-360"
    min_value: -180
    max_value: 180
    step: 1
    initial_value: 0
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Left Edge LEDs"
    id: num_leds_izq
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Top Edge LEDs (Ceiling)"
    id: num_leds_sup
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Right Edge LEDs"
    id: num_leds_der
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Bottom Edge LEDs (Center)"
    id: num_leds_inf
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

script:
  - id: enviar_color_ha
    mode: parallel
    max_runs: 10
    parameters:
      entidad: string
      r: int
      g: int
      b: int
    then:
      - homeassistant.service:
          service: light.turn_on
          data:
            entity_id: !lambda "return entidad;"
          data_template:
            transition: "0.3"
            rgb_color: !lambda 'return "[" + std::to_string(r) + "," + std::to_string(g) + "," + std::to_string(b) + "]";'

  - id: ciclo_test_luces
    mode: restart
    then:
      - lambda: 'id(test_en_curso) = true;'
      # Paso 1: Izq Rojo, Centro Verde, Der Azul (Techo Blanco)
      - script.execute:
          id: enviar_color_ha
          entidad: "light.comedor_luces_izquierda"
          r: 255
          g: 0
          b: 0
      - script.execute:
          id: enviar_color_ha
          entidad: "light.comedor_luces_centro"
          r: 0
          g: 255
          b: 0
      - script.execute:
          id: enviar_color_ha
          entidad: "light.comedor_luces_derecha"
          r: 0
          g: 0
          b: 255
      - if:
          condition:
            lambda: 'return id(activar_techo).state;'
          then:
            - script.execute:
                id: enviar_color_ha
                entidad: "light.comedor_luces_techo"
                r: 255
                g: 255
                b: 255
      - delay: 2s

      # Paso 2: Izq Verde, Centro Azul, Der Rojo (Techo Amarillo)
      - script.execute:
          id: enviar_color_ha
          entidad: "light.comedor_luces_izquierda"
          r: 0
          g: 255
          b: 0
      - script.execute:
          id: enviar_color_ha
          entidad: "light.comedor_luces_centro"
          r: 0
          g: 0
          b: 255
      - script.execute:
          id: enviar_color_ha
          entidad: "light.comedor_luces_derecha"
          r: 255
          g: 0
          b: 0
      - if:
          condition:
            lambda: 'return id(activar_techo).state;'
          then:
            - script.execute:
                id: enviar_color_ha
                entidad: "light.comedor_luces_techo"
                r: 255
                g: 255
                b: 0
      - delay: 2s

      # Paso 3: Izq Azul, Centro Rojo, Der Verde (Techo Cian)
      - script.execute:
          id: enviar_color_ha
          entidad: "light.comedor_luces_izquierda"
          r: 0
          g: 0
          b: 255
      - script.execute:
          id: enviar_color_ha
          entidad: "light.comedor_luces_centro"
          r: 255
          g: 0
          b: 0
      - script.execute:
          id: enviar_color_ha
          entidad: "light.comedor_luces_derecha"
          r: 0
          g: 255
          b: 0
      - if:
          condition:
            lambda: 'return id(activar_techo).state;'
          then:
            - script.execute:
                id: enviar_color_ha
                entidad: "light.comedor_luces_techo"
                r: 0
                g: 255
                b: 255
      - delay: 2s
      - lambda: 'id(test_en_curso) = false;'

button:
  - platform: template
    name: "Test RGB Sequence"
    icon: "mdi:palette-swatch-outline"
    on_press:
      - script.execute: ciclo_test_luces

interval:
  - interval: 80ms
    then:
      - lambda: |-
          // Variables estáticas para filtro IIR e histéresis
          static int fIzqR = -1, fIzqG = -1, fIzqB = -1;
          static int fSupR = -1, fSupG = -1, fSupB = -1;
          static int fCenR = -1, fCenG = -1, fCenB = -1;
          static int fDerR = -1, fDerG = -1, fDerB = -1;

          static int pIzqR = -1, pIzqG = -1, pIzqB = -1;
          static int pSupR = -1, pSupG = -1, pSupB = -1;
          static int pCenR = -1, pCenG = -1, pCenB = -1;
          static int pDerR = -1, pDerG = -1, pDerB = -1;

          static uint32_t lastSentIzq = 0;
          static uint32_t lastSentDer = 0;
          static uint32_t lastSentCen = 0;
          static uint32_t lastSentSup = 0;

          // Si estamos en modo apagado o test, resetear estados y salir
          if (id(test_en_curso) || !id(modo_ambilight).state) {
            fIzqR = -1; fSupR = -1; fCenR = -1; fDerR = -1;
            pIzqR = -1; pSupR = -1; pCenR = -1; pDerR = -1;
            lastSentIzq = 0; lastSentDer = 0; lastSentCen = 0; lastSentSup = 0;
            return;
          }

          const int MAX_LEDS = 38;
          uint8_t ledData[MAX_LEDS * 3] = {0};

          int ledsLeidos = capture_govee_frame(ledData, MAX_LEDS);
          if (ledsLeidos < 30) return;

          float rotDeg = id(rotacion_offset).state;
          int offset = (int)roundf(rotDeg * 36.0f / 360.0f);
          bool invert = id(invertir_sentido).state;
          int nIzq = (int)id(num_leds_izq).state;
          int nSup = (int)id(num_leds_sup).state;
          int nDer = (int)id(num_leds_der).state;
          int nInf = (int)id(num_leds_inf).state;

          const int TOTAL_LEDS_LOOP = 36;

          auto getLedIndex = [&](int virtualPos) -> int {
            int pos = virtualPos % TOTAL_LEDS_LOOP;
            if (invert) {
              pos = (TOTAL_LEDS_LOOP * 10 + offset - pos) % TOTAL_LEDS_LOOP;
            } else {
              pos = (TOTAL_LEDS_LOOP * 10 + pos + offset) % TOTAL_LEDS_LOOP;
            }
            return 1 + pos;
          };

          // A. Zona Izquierda (Lateral Izquierdo)
          long sR_izq = 0, sG_izq = 0, sB_izq = 0;
          for (int i = 0; i < nIzq; i++) {
            int k = getLedIndex(i);
            sG_izq += ledData[k * 3];
            sR_izq += ledData[k * 3 + 1];
            sB_izq += ledData[k * 3 + 2];
          }
          int izqR = sR_izq / nIzq;
          int izqG = sG_izq / nIzq;
          int izqB = sB_izq / nIzq;

          // B. Zona Techo (Borde Superior)
          int startSupVirt = nIzq;
          long sR_sup = 0, sG_sup = 0, sB_sup = 0;
          for (int i = startSupVirt; i < startSupVirt + nSup; i++) {
            int k = getLedIndex(i);
            sG_sup += ledData[k * 3];
            sR_sup += ledData[k * 3 + 1];
            sB_sup += ledData[k * 3 + 2];
          }
          int supR = (nSup > 0) ? (sR_sup / nSup) : 0;
          int supG = (nSup > 0) ? (sG_sup / nSup) : 0;
          int supB = (nSup > 0) ? (sB_sup / nSup) : 0;

          // C. Zona Derecha (Lateral Derecho)
          int startDerVirt = nIzq + nSup;
          long sR_der = 0, sG_der = 0, sB_der = 0;
          for (int i = startDerVirt; i < startDerVirt + nDer; i++) {
            int k = getLedIndex(i);
            sG_der += ledData[k * 3];
            sR_der += ledData[k * 3 + 1];
            sB_der += ledData[k * 3 + 2];
          }
          int derR = sR_der / nDer;
          int derG = sG_der / nDer;
          int derB = sB_der / nDer;

          // D. Zona Centro (Borde Inferior / Mesa)
          int startInfVirt = startDerVirt + nDer;
          if (nInf < 1) nInf = 1;

          long sR_cen = 0, sG_cen = 0, sB_cen = 0;
          for (int i = startInfVirt; i < startInfVirt + nInf; i++) {
            int k = getLedIndex(i);
            sG_cen += ledData[k * 3];
            sR_cen += ledData[k * 3 + 1];
            sB_cen += ledData[k * 3 + 2];
          }
          int cenR = sR_cen / nInf;
          int cenG = sG_cen / nInf;
          int cenB = sB_cen / nInf;

          // Filtro IIR de suavizado temporal
          if (fIzqR < 0) {
            fIzqR = izqR; fIzqG = izqG; fIzqB = izqB;
            fSupR = supR; fSupG = supG; fSupB = supB;
            fCenR = cenR; fCenG = cenG; fCenB = cenB;
            fDerR = derR; fDerG = derG; fDerB = derB;
          } else {
            fIzqR = (fIzqR * 6 + izqR * 4) / 10;
            fIzqG = (fIzqG * 6 + izqG * 4) / 10;
            fIzqB = (fIzqB * 6 + izqB * 4) / 10;

            fSupR = (fSupR * 6 + supR * 4) / 10;
            fSupG = (fSupG * 6 + supG * 4) / 10;
            fSupB = (fSupB * 6 + supB * 4) / 10;

            fCenR = (fCenR * 6 + cenR * 4) / 10;
            fCenG = (fCenG * 6 + cenG * 4) / 10;
            fCenB = (fCenB * 6 + cenB * 4) / 10;

            fDerR = (fDerR * 6 + derR * 4) / 10;
            fDerG = (fDerG * 6 + derG * 4) / 10;
            fDerB = (fDerB * 6 + derB * 4) / 10;
          }

          uint32_t tAhora = millis();

          // Histéresis y cadencia adaptativa:
          // Derecha e Izquierda (Luces WiFi locales + tira): máx 3 actualizaciones/seg (cada 300ms)
          // Centro (Barra Tuya Cloud): máx 1 actualización/seg (cada 1000ms)
          const int THRESHOLD_LOCAL = 12;
          const int THRESHOLD_TUYA = 16;

          if (tAhora - lastSentIzq >= 300) {
            if (pIzqR < 0 || abs(fIzqR - pIzqR) >= THRESHOLD_LOCAL || abs(fIzqG - pIzqG) >= THRESHOLD_LOCAL || abs(fIzqB - pIzqB) >= THRESHOLD_LOCAL) {
              id(enviar_color_ha)->execute("light.comedor_luces_izquierda", fIzqR, fIzqG, fIzqB);
              pIzqR = fIzqR; pIzqG = fIzqG; pIzqB = fIzqB;
              lastSentIzq = tAhora;
            }
          }

          if (tAhora - lastSentDer >= 300) {
            if (pDerR < 0 || abs(fDerR - pDerR) >= THRESHOLD_LOCAL || abs(fDerG - pDerG) >= THRESHOLD_LOCAL || abs(fDerB - pDerB) >= THRESHOLD_LOCAL) {
              id(enviar_color_ha)->execute("light.comedor_luces_derecha", fDerR, fDerG, fDerB);
              pDerR = fDerR; pDerG = fDerG; pDerB = fDerB;
              lastSentDer = tAhora;
            }
          }

          if (tAhora - lastSentCen >= 1000) {
            if (pCenR < 0 || abs(fCenR - pCenR) >= THRESHOLD_TUYA || abs(fCenG - pCenG) >= THRESHOLD_TUYA || abs(fCenB - pCenB) >= THRESHOLD_TUYA) {
              id(enviar_color_ha)->execute("light.comedor_luces_centro", fCenR, fCenG, fCenB);
              pCenR = fCenR; pCenG = fCenG; pCenB = fCenB;
              lastSentCen = tAhora;
            }
          }

          if (id(activar_techo).state && (tAhora - lastSentSup >= 300)) {
            if (pSupR < 0 || abs(fSupR - pSupR) >= THRESHOLD_LOCAL || abs(fSupG - pSupG) >= THRESHOLD_LOCAL || abs(fSupB - pSupB) >= THRESHOLD_LOCAL) {
              id(enviar_color_ha)->execute("light.comedor_luces_techo", fSupR, fSupG, fSupB);
              pSupR = fSupR; pSupG = fSupG; pSupB = fSupB;
              lastSentSup = tAhora;
            }
          }

          // Log de diagnóstico periódico cada 3 segundos
          static uint32_t tUltimoLog = 0;
          if (tAhora - tUltimoLog >= 3000) {
            ESP_LOGI("ambilight", "Govee Activo: %d LEDs | IZQ(%d,%d,%d) | CEN(%d,%d,%d) | DER(%d,%d,%d)",
                     ledsLeidos, fIzqR, fIzqG, fIzqB, fCenR, fCenG, fCenB, fDerR, fDerG, fDerB);
            tUltimoLog = tAhora;
          }

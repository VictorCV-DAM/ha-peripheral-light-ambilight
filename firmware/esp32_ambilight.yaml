# Board: ESP32-C3 DevKitM-1 (Espressif RISC-V 160MHz)
esphome:
  name: esp32-ambiligth
  friendly_name: Ambilight Govee Bridge
  includes:
    - govee_sniffer.h
  on_boot:
    priority: -100
    then:
      - delay: 1s
      - lambda: |-
          float val = id(velocidad_transicion).state;
          if (isnan(val)) val = 0.0f;
          float lat = 65.0f + (val * 1000.0f);
          id(latencia_estimada).publish_state(lat);
          id(latencia_media_registrada).publish_state(lat);
          id(govee_signal_active).publish_state(false);
          id(govee_hardware_state).publish_state("Standby");

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  reboot_timeout: 0s
  encryption:
    key: "87R9C1MCPvg8ijQB5aM+enPk26Hbs51ah0OtsMBNv6w="

safe_mode:
  disabled: true

ota:
  - platform: esphome

wifi:
  ssid: "PAGAtuWIFI"
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: false
  manual_ip:
    static_ip: 192.168.1.49
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1

button:
  - platform: restart
    name: "Restart ESP32"
    id: reiniciar_esp32
    icon: "mdi:restart"

  - platform: template
    name: "View Live Logs"
    id: btn_abrir_registros
    icon: "mdi:console-network"
    on_press:
      - homeassistant.service:
          service: script.ver_pantalla_de_registros

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode:
        input: true
        pulldown: true
    id: pin_datos
    internal: true

  - platform: template
    name: "Govee Signal Active"
    id: govee_signal_active
    device_class: running
    icon: "mdi:television-ambient-light"

text_sensor:
  - platform: template
    name: "Govee Hardware State"
    id: govee_hardware_state
    icon: "mdi:television-shimmer"

sensor:
  - platform: template
    name: "Estimated Latency"
    id: latencia_estimada
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    icon: "mdi:timer-outline"
    state_class: measurement

  - platform: template
    name: "Average Latency (20s)"
    id: latencia_media_registrada
    unit_of_measurement: "ms"
    accuracy_decimals: 0
    icon: "mdi:chart-timeline-variant"
    state_class: measurement

globals:
  - id: test_en_curso
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: lat_sum
    type: float
    initial_value: '0.0'
  - id: lat_count
    type: uint32_t
    initial_value: '0'

switch:
  - platform: template
    name: "1. Ambilight Mode"
    id: modo_ambilight
    icon: "mdi:television-ambient-light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "3. Ceiling Light"
    id: activar_techo
    icon: "mdi:ceiling-light"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "4. Blackout Mode"
    id: modo_blackout
    icon: "mdi:lightbulb-off-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Rotation: Invert Direction"
    id: invertir_sentido
    icon: "mdi:rotate-left-variant"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: template
    name: "2. Transition Speed"
    id: velocidad_transicion
    unit_of_measurement: "s"
    icon: "mdi:transition"
    min_value: 0.0
    max_value: 1.5
    step: 0.05
    initial_value: 0.0
    mode: slider
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          float val = id(velocidad_transicion).state;
          float lat = 65.0f + (val * 1000.0f);
          id(latencia_estimada).publish_state(lat);

  - platform: template
    name: "Edge 1 - Left (LEDs)"
    id: num_leds_izq
    icon: "mdi:arrow-left-bold-box-outline"
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 2 - Top (LEDs)"
    id: num_leds_sup
    icon: "mdi:arrow-up-bold-box-outline"
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 3 - Right (LEDs)"
    id: num_leds_der
    icon: "mdi:arrow-right-bold-box-outline"
    min_value: 4
    max_value: 12
    step: 1
    initial_value: 7
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Edge 4 - Bottom (LEDs)"
    id: num_leds_inf
    icon: "mdi:arrow-down-bold-box-outline"
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 11
    mode: slider
    optimistic: true
    restore_value: true

  - platform: template
    name: "Rotation: 360° Angle"
    id: rotacion_offset
    unit_of_measurement: "°"
    icon: "mdi:rotate-360"
    min_value: -180
    max_value: 180
    step: 1
    initial_value: 0
    mode: slider
    optimistic: true
    restore_value: true

script:
  - id: enviar_color_ha
    mode: parallel
    max_runs: 10
    parameters:
      entidad: string
      r: int
      g: int
      b: int
      trans: float
    then:
      - lambda: |-
          ESP_LOGI("ha_send", "EVENT -> %s: R=%d G=%d B=%d (trans=%.2fs)", entidad.c_str(), r, g, b, trans);
      - homeassistant.event:
          event: esphome.ambilight_color
          data:
            entity_id: !lambda "return entidad;"
            r: !lambda "return std::to_string(r);"
            g: !lambda "return std::to_string(g);"
            b: !lambda "return std::to_string(b);"
            transition: !lambda 'return str_sprintf("%.2f", trans);'

interval:
  - interval: 20s
    then:
      - lambda: |-
          if (id(lat_count) > 0) {
            float avg = id(lat_sum) / (float)id(lat_count);
            id(latencia_media_registrada).publish_state(roundf(avg));
          } else {
            float base = 65.0f + (id(velocidad_transicion).state * 1000.0f);
            id(latencia_media_registrada).publish_state(roundf(base));
          }
          id(lat_sum) = 0.0f;
          id(lat_count) = 0;

  - interval: 40ms
    then:
      - lambda: |-
          static int fIzqR = -1, fIzqG = -1, fIzqB = -1;
          static int fSupR = -1, fSupG = -1, fSupB = -1;
          static int fCenR = -1, fCenG = -1, fCenB = -1;
          static int fDerR = -1, fDerG = -1, fDerB = -1;

          static int pIzqR = -1, pIzqG = -1, pIzqB = -1;
          static int pSupR = -1, pSupG = -1, pSupB = -1;
          static int pCenR = -1, pCenG = -1, pCenB = -1;
          static int pDerR = -1, pDerG = -1, pDerB = -1;

          static uint32_t tDiag = 0;
          if (id(test_en_curso)) {
            return;
          }

          static uint32_t lastValidFrameTime = 0;
          static uint32_t prevFrameTime = 0;
          static uint32_t lastFrameInterval = 0;
          static bool currentSignalActive = false;
          static std::string currentMode = "Standby";
          static int consecutiveVideoFrames = 0;
          static int consecutiveStaticFrames = 0;

          uint32_t now = millis();
          uint32_t tLoopStart = now;

          const int MAX_LEDS = 37;
          uint8_t ledData[MAX_LEDS * 3] = {0};

          int ledsLeidos = capture_govee_frame(ledData, MAX_LEDS);

          if (ledsLeidos >= 37) {
            lastValidFrameTime = now;
            if (prevFrameTime > 0) {
              lastFrameInterval = now - prevFrameTime;
            }
            prevFrameTime = now;
          } else {
            // Si la línea está en silencio más de 8s -> Standby automático:
            if (now - lastValidFrameTime > 8000) {
              if (currentMode != "Standby") {
                ESP_LOGW("mode", "CAMBIO DE ESTADO: %s -> Standby (sin señal > 8s)", currentMode.c_str());
                currentMode = "Standby";
                currentSignalActive = false;
                consecutiveVideoFrames = 0;
                consecutiveStaticFrames = 0;
                id(govee_signal_active).publish_state(false);
                id(govee_hardware_state).publish_state("Standby");
              }
            }

            if (millis() - tDiag >= 2000) {
              ESP_LOGW("sniffer", "Trama incompleta o sin señal: %d/37 leds (GPIO3=%d).", ledsLeidos, id(pin_datos).state);
              tDiag = millis();
            }
            return;
          }

          float rotDeg = id(rotacion_offset).state;
          int offset = (int)roundf(rotDeg * 36.0f / 360.0f);
          bool invert = id(invertir_sentido).state;
          int nIzq = (int)id(num_leds_izq).state;
          int nSup = (int)id(num_leds_sup).state;
          int nDer = (int)id(num_leds_der).state;
          int nInf = (int)id(num_leds_inf).state;

          const int TOTAL_LEDS_LOOP = 36;

          auto getLedIndex = [&](int virtualPos) -> int {
            int pos = virtualPos % TOTAL_LEDS_LOOP;
            if (invert) {
              pos = (TOTAL_LEDS_LOOP * 10 + offset - pos) % TOTAL_LEDS_LOOP;
            } else {
              pos = (TOTAL_LEDS_LOOP * 10 + pos + offset) % TOTAL_LEDS_LOOP;
            }
            return 1 + pos;
          };

          // WS2811 GRB: Byte 0 = G, Byte 1 = R, Byte 2 = B
          // A. Zona Izquierda
          long sR_izq = 0, sG_izq = 0, sB_izq = 0;
          for (int i = 0; i < nIzq; i++) {
            int k = getLedIndex(i);
            sG_izq += ledData[k * 3 + 0];
            sR_izq += ledData[k * 3 + 1];
            sB_izq += ledData[k * 3 + 2];
          }
          int izqR = sR_izq / nIzq;
          int izqG = sG_izq / nIzq;
          int izqB = sB_izq / nIzq;

          // B. Zona Techo (Borde Superior)
          int startSupVirt = nIzq;
          long sR_sup = 0, sG_sup = 0, sB_sup = 0;
          for (int i = startSupVirt; i < startSupVirt + nSup; i++) {
            int k = getLedIndex(i);
            sG_sup += ledData[k * 3 + 0];
            sR_sup += ledData[k * 3 + 1];
            sB_sup += ledData[k * 3 + 2];
          }
          int supR = (nSup > 0) ? (sR_sup / nSup) : 0;
          int supG = (nSup > 0) ? (sG_sup / nSup) : 0;
          int supB = (nSup > 0) ? (sB_sup / nSup) : 0;

          // C. Zona Derecha
          int startDerVirt = nIzq + nSup;
          long sR_der = 0, sG_der = 0, sB_der = 0;
          for (int i = startDerVirt; i < startDerVirt + nDer; i++) {
            int k = getLedIndex(i);
            sG_der += ledData[k * 3 + 0];
            sR_der += ledData[k * 3 + 1];
            sB_der += ledData[k * 3 + 2];
          }
          int derR = sR_der / nDer;
          int derG = sG_der / nDer;
          int derB = sB_der / nDer;

          // D. Zona Centro (Borde Inferior / Mesa)
          int startInfVirt = startDerVirt + nDer;
          if (nInf < 1) nInf = 1;

          long sR_cen = 0, sG_cen = 0, sB_cen = 0;
          for (int i = startInfVirt; i < startInfVirt + nInf; i++) {
            int k = getLedIndex(i);
            sG_cen += ledData[k * 3 + 0];
            sR_cen += ledData[k * 3 + 1];
            sB_cen += ledData[k * 3 + 2];
          }
          int cenR = sR_cen / nInf;
          int cenG = sG_cen / nInf;
          int cenB = sB_cen / nInf;

          // Detección del estado real del hardware (Vídeo vs Estático vs Standby)
          int maxOverall = std::max({izqR, izqG, izqB, supR, supG, supB, derR, derG, derB, cenR, cenG, cenB});
          bool isBlack = (maxOverall <= 4);

          int maxR = std::max({izqR, supR, derR, cenR});
          int minR = std::min({izqR, supR, derR, cenR});
          int maxG = std::max({izqG, supG, derG, cenG});
          int minG = std::min({izqG, supG, derG, cenG});
          int maxB = std::max({izqB, supB, derB, cenB});
          int minB = std::min({izqB, supB, derB, cenB});

          int totalSpread = (maxR - minR) + (maxG - minG) + (maxB - minB);

          static int prevRawIzqR = -1, prevRawIzqG = -1, prevRawIzqB = -1;
          static int prevRawDerR = -1, prevRawDerG = -1, prevRawDerB = -1;

          int tempDelta = (prevRawIzqR < 0) ? 0 :
                          (abs(izqR - prevRawIzqR) + abs(izqG - prevRawIzqG) + abs(izqB - prevRawIzqB) +
                           abs(derR - prevRawDerR) + abs(derG - prevRawDerG) + abs(derB - prevRawDerB));

          // Detección y neutralización de micro-glitches de bus:
          // Un salto anómalo (delta > 120) que no venga acompañado de una dispersión cromática real (spread >= 40)
          // es un bit corrupto de un único fotograma (40ms). Lo descartamos para no falsear el estado ni el delta posterior.
          bool isGlitch = (prevRawIzqR >= 0 && tempDelta > 120 && totalSpread < 40);

          if (!isGlitch) {
            prevRawIzqR = izqR; prevRawIzqG = izqG; prevRawIzqB = izqB;
            prevRawDerR = derR; prevRawDerG = derG; prevRawDerB = derB;
          }

          // Integrador Leaky-Bucket Asimétrico con límites de saturación:
          static int consecutiveBlackFrames = 0;

          if (isBlack) {
            consecutiveBlackFrames++;
            if (consecutiveVideoFrames > 1) consecutiveVideoFrames -= 2;
            else consecutiveVideoFrames = 0;
            if (consecutiveStaticFrames > 1) consecutiveStaticFrames -= 2;
            else consecutiveStaticFrames = 0;
          } else if (isGlitch) {
            // Glitch eléctrico aislado: ignorar sin alterar contadores
          } else {
            consecutiveBlackFrames = 0;
            // Modo Vídeo Real (Ambilight): dispersión cromática entre bordes (spread >= 40)
            // o combinación de dispersión moderada con movimiento fluido continuo.
            bool isRealVideo = (totalSpread >= 40 || (totalSpread >= 18 && tempDelta >= 15));
            if (isRealVideo) {
              consecutiveVideoFrames++;
              if (consecutiveStaticFrames > 2) consecutiveStaticFrames -= 3;
              else consecutiveStaticFrames = 0;
            } else {
              // Modo Lámpara (color uniforme en todo el perímetro, spread < 18 y delta < 15)
              consecutiveStaticFrames++;
              if (consecutiveVideoFrames > 2) consecutiveVideoFrames -= 3;
              else consecutiveVideoFrames = 0;
            }
          }

          // Evitar desbordamiento de contadores:
          consecutiveVideoFrames = std::min(consecutiveVideoFrames, 100);
          consecutiveStaticFrames = std::min(consecutiveStaticFrames, 150);
          consecutiveBlackFrames = std::min(consecutiveBlackFrames, 100);

          std::string targetCandidate = currentMode;

          if (currentMode == "Standby") {
            // Salida ágil de Standby al encender (300-400ms):
            if (!isBlack) {
              if (consecutiveVideoFrames >= 8) {
                targetCandidate = "Vídeo";
              } else if (consecutiveStaticFrames >= 10) {
                targetCandidate = "Estático";
              }
            }
          } else if (currentMode == "Estático") {
            // Estando en Estático:
            if (consecutiveBlackFrames >= 75) {
              // Pantalla/tira apagada en negro durante 3.0s continuos -> Standby
              targetCandidate = "Standby";
            } else if (consecutiveVideoFrames >= 30) {
              // Exige ~1.2s de vídeo real sostenido. Los glitches de 1 trama jamás superan vF=2.
              targetCandidate = "Vídeo";
            }
          } else if (currentMode == "Vídeo") {
            // Estando en Vídeo:
            if (consecutiveBlackFrames >= 75) {
              // 3.0s de negro absoluto sostenido -> Standby (ignora fundidos a negro de cine de 1-2s)
              targetCandidate = "Standby";
            } else if (consecutiveStaticFrames >= 80) {
              // Exige 3.2 segundos continuos de lámpara fija uniforme para salir de Vídeo.
              // En una película, las tomas estáticas o diálogos jamás alcanzan 3.2s de uniformidad total.
              targetCandidate = "Estático";
            }
          }

          if (targetCandidate != currentMode) {
            ESP_LOGW("mode", "CAMBIO DE ESTADO: %s -> %s (spread=%d, dt=%d, vF=%d, sF=%d, bF=%d)",
                     currentMode.c_str(), targetCandidate.c_str(), totalSpread, tempDelta,
                     consecutiveVideoFrames, consecutiveStaticFrames, consecutiveBlackFrames);
            currentMode = targetCandidate;
            currentSignalActive = (currentMode != "Standby");
            consecutiveVideoFrames = 0;
            consecutiveStaticFrames = 0;
            consecutiveBlackFrames = 0;
            id(govee_hardware_state).publish_state(currentMode);
            id(govee_signal_active).publish_state(currentSignalActive);
          }

          static uint32_t lastDiagPrint = 0;
          if (now - lastDiagPrint >= 2000) {
            ESP_LOGI("mode", "Govee Hardware: %s (spread=%d, dt=%d, vF=%d, sF=%d, bF=%d)",
                     currentMode.c_str(), totalSpread, tempDelta,
                     consecutiveVideoFrames, consecutiveStaticFrames, consecutiveBlackFrames);
            lastDiagPrint = now;
          }

          // Si el interruptor del puente está APAGADO en Home Assistant,
          // no enviamos nada a las bombillas secundarias (el hardware queda monitorizado sin alterar nada).
          if (!id(modo_ambilight).state) {
            fIzqR = -1; fSupR = -1; fCenR = -1; fDerR = -1;
            pIzqR = -1; pSupR = -1; pCenR = -1; pDerR = -1;
            if (millis() - tDiag >= 3000) {
              ESP_LOGI("sniffer", "PAUSADO: Modo Ambilight está APAGADO en Home Assistant.");
              tDiag = millis();
            }
            return;
          }

          // Suavizado temporal IIR (75/25): elimina el parpadeo de +-10 del sensor de cámara en estático
          // pero responde en el primer fotograma (40ms) ante cambios reales de escena.
          if (fIzqR < 0) {
            fIzqR = izqR; fIzqG = izqG; fIzqB = izqB;
            fSupR = supR; fSupG = supG; fSupB = supB;
            fCenR = cenR; fCenG = cenG; fCenB = cenB;
            fDerR = derR; fDerG = derG; fDerB = derB;
          } else {
            fIzqR = (fIzqR * 3 + izqR) / 4;
            fIzqG = (fIzqG * 3 + izqG) / 4;
            fIzqB = (fIzqB * 3 + izqB) / 4;

            fSupR = (fSupR * 3 + supR) / 4;
            fSupG = (fSupG * 3 + supG) / 4;
            fSupB = (fSupB * 3 + supB) / 4;

            fCenR = (fCenR * 3 + cenR) / 4;
            fCenG = (fCenG * 3 + cenG) / 4;
            fCenB = (fCenB * 3 + cenB) / 4;

            fDerR = (fDerR * 3 + derR) / 4;
            fDerG = (fDerG * 3 + derG) / 4;
            fDerB = (fDerB * 3 + derB) / 4;
          }

          static uint32_t lastSendIzq = 0;
          static uint32_t lastSendDer = 0;
          static uint32_t lastSendCen = 0;
          static uint32_t lastSendSup = 0;
          static uint32_t lastForceSend = 0;

          now = millis();
          bool force = (now - lastForceSend > 15000);

          float trans = id(velocidad_transicion).state;
          uint32_t minInterval = 60;
          if (trans > 0.01f) {
            minInterval = (uint32_t)(trans * 750.0f);
            if (minInterval < 60) minInterval = 60;
          }

          bool sentAny = false;

          // Disparo ante cambios reales (delta >= 12)
          bool chgIzq = (abs(fIzqR - pIzqR) >= 12 || abs(fIzqG - pIzqG) >= 12 || abs(fIzqB - pIzqB) >= 12);
          if ((chgIzq || (force && (abs(fIzqR - pIzqR) >= 4 || abs(fIzqG - pIzqG) >= 4 || abs(fIzqB - pIzqB) >= 4))) &&
              (now - lastSendIzq >= minInterval || (force && chgIzq))) {
            id(enviar_color_ha)->execute("light.comedor_luces_izquierda", fIzqR, fIzqG, fIzqB, trans);
            pIzqR = fIzqR; pIzqG = fIzqG; pIzqB = fIzqB;
            lastSendIzq = now;
            sentAny = true;
          }

          bool chgDer = (abs(fDerR - pDerR) >= 12 || abs(fDerG - pDerG) >= 12 || abs(fDerB - pDerB) >= 12);
          if ((chgDer || (force && (abs(fDerR - pDerR) >= 4 || abs(fDerG - pDerG) >= 4 || abs(fDerB - pDerB) >= 4))) &&
              (now - lastSendDer >= minInterval || (force && chgDer))) {
            id(enviar_color_ha)->execute("light.comedor_luces_derecha", fDerR, fDerG, fDerB, trans);
            pDerR = fDerR; pDerG = fDerG; pDerB = fDerB;
            lastSendDer = now;
            sentAny = true;
          }

          bool chgCen = (abs(fCenR - pCenR) >= 12 || abs(fCenG - pCenG) >= 12 || abs(fCenB - pCenB) >= 12);
          if ((chgCen || (force && (abs(fCenR - pCenR) >= 4 || abs(fCenG - pCenG) >= 4 || abs(fCenB - pCenB) >= 4))) &&
              (now - lastSendCen >= minInterval || (force && chgCen))) {
            id(enviar_color_ha)->execute("light.comedor_luces_centro", fCenR, fCenG, fCenB, trans);
            pCenR = fCenR; pCenG = fCenG; pCenB = fCenB;
            lastSendCen = now;
            sentAny = true;
          }

          if (id(activar_techo).state) {
            bool chgSup = (abs(fSupR - pSupR) >= 12 || abs(fSupG - pSupG) >= 12 || abs(fSupB - pSupB) >= 12);
            if ((chgSup || (force && (abs(fSupR - pSupR) >= 4 || abs(fSupG - pSupG) >= 4 || abs(fSupB - pSupB) >= 4))) &&
                (now - lastSendSup >= minInterval || (force && chgSup))) {
              id(enviar_color_ha)->execute("light.comedor_luces_techo", fSupR, fSupG, fSupB, trans);
              pSupR = fSupR; pSupG = fSupG; pSupB = fSupB;
              lastSendSup = now;
              sentAny = true;
            }
          }
          if (force) lastForceSend = now;

          if (sentAny) {
            uint32_t elapsed = millis() - tLoopStart;
            float measuredLat = 65.0f + (float)elapsed + (trans * 1000.0f);
            id(lat_sum) += measuredLat;
            id(lat_count)++;
          }

          static uint32_t tLog = 0;
          if (millis() - tLog >= 1000) {
            ESP_LOGI("ambilight", "LEDs: %d | IZQ(R:%d,G:%d,B:%d) CEN(R:%d,G:%d,B:%d) DER(R:%d,G:%d,B:%d) | Trans: %.2fs (Lat: %.0fms)",
                     ledsLeidos,
                     fIzqR, fIzqG, fIzqB, fCenR, fCenG, fCenB, fDerR, fDerG, fDerB,
                     trans, 65.0f + (trans * 1000.0f));
            tLog = millis();
          }
